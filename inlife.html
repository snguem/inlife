function notifSupported() { return 'Notification' in window; }
function enableFinanceNotifications() {
  if (!notifSupported()) return;
  Notification.requestPermission().then(async () => {
    await registerPeriodicSync();
    render();
    checkFinanceNotifications(true);
  });
}
function checkFinanceNotifications(force) {
  try {
    if (!notifSupported() || Notification.permission !== 'granted') return;
    const today = dateKey(new Date());
    if (!force && state.finance.lastNotified === today) return;
    const rem = financeReminders();
    if (!rem.length) return;
    const body = rem.slice(0, 3).map(r => `${reminderText(r, true)} (${dueLabel(r.days)})`).join('\n');
    const opts = { body, tag: 'inlife-finance', icon: 'icons/icon-192.png', badge: 'icons/badge-96.png', data: { url: './inlife.html?screen=finance' } };
    if (swReg) swReg.showNotification('Rappels finances', opts);
    else new Notification('Rappels finances', opts);
    state.finance.lastNotified = today;
    saveState();
  } catch (e) { /* notifications indisponibles sur ce navigateur */ }
}

// --- Écran ---
let financeTab = 'budget';
let financeMonthOffset = 0;
let showSettled = false;

function renderReminderCard(rem) {
  if (!rem.length) return '';
  return `
    <div class="card reminders">
      <div class="rem-head">${ic('bell')}<span style="flex:1">Rappels</span><span class="count-pill">${rem.length}</span></div>
      ${rem.map(r => `
        <button class="rem-row ${r.days < 0 ? 'late' : ''}" onclick="openDebtDetail('${r.d.id}')">
          <span class="avatar" style="--k:${r.d.direction === 'lent' ? 'var(--mint)' : 'var(--rose)'}">${escapeHtml(initials(r.d.person))}</span>
          <span class="rem-main"><b>${reminderText(r)}</b><span>${fmtDate(r.due.date, { weekday: 'short', day: 'numeric', month: 'short' })} · ${dueLabel(r.days)}</span></span>
          <span style="color:var(--ink-3)">${ic('chevR')}</span>
        </button>`).join('')}
    </div>`;
}

function renderFinance() {
  const rem = financeReminders();
  let html = `
    ${screenHead('Finances', financeTab === 'budget' ? 'Tes entrées et dépenses du mois' : 'Qui te doit, à qui tu dois', `<button class="icon-btn primary" onclick="openFinanceAdd()" aria-label="Ajouter">${ic('plus')}</button>`)}
    ${renderReminderCard(rem)}
    <div class="tabs2" role="tablist">
      <button role="tab" aria-selected="${financeTab === 'budget'}" class="${financeTab === 'budget' ? 'on' : ''}" onclick="financeTab='budget';render()">Budget</button>
      <button role="tab" aria-selected="${financeTab === 'debts'}" class="${financeTab === 'debts' ? 'on' : ''}" onclick="financeTab='debts';render()">Prêts et emprunts</button>
    </div>
    ${financeTab === 'budget' ? renderBudget() : renderDebts()}
  `;
  document.getElementById('app').innerHTML = html;
}

function renderBudget() {
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + financeMonthOffset);
  const ym = `${base.getFullYear()}-${pad(base.getMonth() + 1)}`;
  const tx = state.finance.transactions.filter(t => t.date.startsWith(ym))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const inc = round2(sumOf(tx.filter(t => t.type === 'income').map(t => t.amount)));
  const exp = round2(sumOf(tx.filter(t => t.type === 'expense').map(t => t.amount)));
  const bal = round2(inc - exp);

  // dépenses par catégorie
  const byCat = {};
  tx.filter(t => t.type === 'expense').forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;

  // mouvements groupés par jour
  let lastDay = '', list = '';
  tx.forEach(t => {
    if (t.date !== lastDay) {
      lastDay = t.date;
      list += `<div class="day-label">${fmtDate(t.date, { weekday: 'long', day: 'numeric', month: 'long' })}</div>`;
    }
    const c = finCat(t.type, t.category);
    list += `
      <button class="tx-row" onclick="openTxForm('${t.id}')">
        <span class="icon-tile sm" style="--k:${c.color}">${ic(c.icon)}</span>
        <span class="tx-main"><b>${escapeHtml(t.label || c.label)}</b><span>${c.label}</span></span>
        <span class="tx-amt ${t.type === 'income' ? 'in' : 'out'}">${money(t.type === 'income' ? t.amount : -t.amount, true)}</span>
      </button>`;
  });

  return `
    <div class="month-nav">
      <button class="icon-btn" onclick="financeMonthOffset--;render()" aria-label="Mois précédent">${ic('chevL')}</button>
      <h2>${base.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</h2>
      <button class="icon-btn" onclick="financeMonthOffset++;render()" aria-label="Mois suivant">${ic('chevR')}</button>
    </div>
    <section class="hero fin-hero ${bal < 0 ? 'neg' : ''}">
      <div class="hero-meta" style="position:relative;z-index:1">Solde du mois</div>
      <div class="fin-big">${money(bal, true)}</div>
      <div class="fin-split">
        <div><span>${ic('arrowDownLeft')}Entrées</span><b>${money(inc)}</b></div>
        <div><span>${ic('arrowUpRight')}Dépenses</span><b>${money(exp)}</b></div>
      </div>
    </section>

    ${cats.length ? `
    <div class="section-head"><h2>Dépenses par catégorie</h2></div>
    <div class="card" style="padding:6px 16px">
      ${cats.map(([id, v]) => {
        const c = finCat('expense', id);
        return `<div class="cat-row" style="--k:${c.color}">
          <span class="icon-tile sm" style="--k:${c.color}">${ic(c.icon)}</span>
          <div><div class="cat-name">${c.label}</div><div class="bar"><div style="width:${Math.round(v / maxCat * 100)}%"></div></div></div>
          <div class="cat-amt">${money(v)}<small>${exp ? Math.round(v / exp * 100) : 0} %</small></div>
        </div>`;
      }).join('')}
    </div>` : ''}

    <div class="section-head"><h2>Mouvements</h2><span class="aside">${tx.length}</span></div>
    ${tx.length ? list : `
      <div class="empty-state"><span class="icon-tile" style="--k:var(--mint)">${ic('wallet')}</span><b>Aucun mouvement ce mois-ci</b>Ajoute une dépense ou une entrée avec le bouton +.
        <div class="add-inline">
          <button class="btn btn-sm btn-soft" onclick="openTxForm(null,'expense')">${ic('arrowUpRight')}Dépense</button>
          <button class="btn btn-sm btn-soft" onclick="openTxForm(null,'income')">${ic('arrowDownLeft')}Entrée</button>
        </div>
      </div>`}
    ${financeMonthOffset !== 0 ? `<button class="btn btn-soft btn-block" style="margin-top:14px" onclick="financeMonthOffset=0;render()">Revenir au mois en cours</button>` : ''}
  `;
}

function renderDebtCard(d) {
  const lent = d.direction === 'lent';
  const rem = debtRemaining(d);
  const pct = Math.min(100, Math.round(debtPaid(d) / d.amount * 100));
  const next = debtNextDue(d);
  const sched = debtSchedule(d);
  const color = lent ? 'var(--mint)' : 'var(--rose)';
  let foot;
  if (rem <= 0) foot = `${ic('check')}Soldé${d.settledAt ? ' le ' + fmtDate(d.settledAt, { day: 'numeric', month: 'short' }) : ''}`;
  else if (next) {
    const days = daysBetween(dateKey(new Date()), next.date);
    foot = `${ic('bell')}<span>Prochaine échéance ${fmtDate(next.date, { day: 'numeric', month: 'short' })} · ${money(next.amount)}</span><span class="${days < 0 ? 'late' : ''}">${dueLabel(days)}</span>`;
  } else foot = `${ic('clock')}Pas de date de remboursement`;
  return `
    <button class="debt-card" onclick="openDebtDetail('${d.id}')">
      <div class="top">
        <span class="avatar" style="--k:${color}">${escapeHtml(initials(d.person))}</span>
        <div class="main"><b>${escapeHtml(d.person)}</b><span>${d.label ? escapeHtml(d.label) : lent ? 'Prêt' : 'Emprunt'}${sched.length ? ` · ${sched.filter(s => s.status === 'paid').length}/${sched.length} échéances` : ''}</span></div>
        <div class="amt"><b>${money(rem)}</b><span>sur ${money(d.amount)}</span></div>
      </div>
      <div class="progress" style="--k:${color}"><div style="width:${pct}%"></div></div>
      <div class="debt-foot">${foot}</div>
    </button>`;
}

function renderDebts() {
  const debts = state.finance.debts;
  const active = debts.filter(d => debtRemaining(d) > 0);
  const settled = debts.filter(d => debtRemaining(d) <= 0);
  const lent = active.filter(d => d.direction === 'lent');
  const borrowed = active.filter(d => d.direction === 'borrowed');
  let html = `
    <div class="stat-grid two">
      ${statTile('arrowDownLeft', 'var(--mint)', money(sumOf(lent.map(debtRemaining))), `On me doit · ${lent.length} personne${lent.length > 1 ? 's' : ''}`)}
      ${statTile('arrowUpRight', 'var(--rose)', money(sumOf(borrowed.map(debtRemaining))), `Je dois · ${borrowed.length} personne${borrowed.length > 1 ? 's' : ''}`)}
    </div>`;
  if (!debts.length) {
    return html + `
      <div class="empty-state" style="margin-top:14px"><span class="icon-tile" style="--k:var(--amber)">${ic('coins')}</span><b>Aucun prêt ni emprunt</b>Note l'argent prêté ou emprunté pour suivre les remboursements et recevoir des rappels.
        <div class="add-inline">
          <button class="btn btn-sm btn-soft" onclick="openDebtForm(null,'lent')">J'ai prêté</button>
          <button class="btn btn-sm btn-soft" onclick="openDebtForm(null,'borrowed')">J'ai emprunté</button>
        </div>
      </div>`;
  }
  if (lent.length) html += `<div class="section-head"><h2>On me doit</h2><span class="aside">${lent.length}</span></div>${lent.map(renderDebtCard).join('')}`;
  if (borrowed.length) html += `<div class="section-head"><h2>Je dois</h2><span class="aside">${borrowed.length}</span></div>${borrowed.map(renderDebtCard).join('')}`;
  if (!active.length) html += `<div class="empty-state" style="margin-top:14px"><b>Tout est soldé</b>Aucun remboursement en attente.</div>`;
  if (settled.length) {
    html += `<button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="showSettled=!showSettled;render()">${showSettled ? 'Masquer' : 'Voir'} les dettes soldées (${settled.length})</button>`;
    if (showSettled) html += `<div style="margin-top:12px">${settled.map(renderDebtCard).join('')}</div>`;
  }
  return html;
}

// --- Ajout ---
function openFinanceAdd() {
  const opt = (label, sub, icon, color, action) => `
    <button class="add-opt" onclick="${action}">
      <span class="icon-tile" style="--k:${color}">${ic(icon)}</span>
      <span>${label}<small>${sub}</small></span>
    </button>`;
  openSheet(`
    <div class="modal-title" style="margin-bottom:16px">Ajouter</div>
    <div class="add-grid">
      ${opt('Dépense', 'Argent dépensé', 'arrowUpRight', 'var(--rose)', "openTxForm(null,'expense')")}
      ${opt('Entrée', 'Argent reçu', 'arrowDownLeft', 'var(--mint)', "openTxForm(null,'income')")}
      ${opt('J\'ai prêté', 'Quelqu\'un me doit', 'coins', 'var(--k-sport)', "openDebtForm(null,'lent')")}
      ${opt('J\'ai emprunté', 'Je dois rembourser', 'wallet', 'var(--amber)', "openDebtForm(null,'borrowed')")}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeModal()">Fermer</button></div>
  `);
}

// --- Mouvement (dépense / entrée) ---
let txDraft = null;
function openTxForm(id, type, keep) {
  if (!keep) {
    const t = id ? state.finance.transactions.find(x => x.id === id) : null;
    txDraft = t ? { ...t, amount: String(t.amount) }
      : { id: null, type: type || 'expense', amount: '', label: '', category: type === 'income' ? 'salary' : 'food', date: dateKey(new Date()) };
  }
  const d = txDraft;
  openSheet(`
    <div class="modal-title">${d.id ? 'Modifier le mouvement' : d.type === 'income' ? 'Nouvelle entrée' : 'Nouvelle dépense'}</div>
    <div class="tabs2" style="margin-top:16px">
      <button class="${d.type === 'expense' ? 'on' : ''}" onclick="txSetType('expense')">Dépense</button>
      <button class="${d.type === 'income' ? 'on' : ''}" onclick="txSetType('income')">Entrée</button>
    </div>
    <div class="amount-field ${d.type}">
      <input id="tx-amount" type="number" inputmode="decimal" step="any" min="0" placeholder="0" aria-label="Montant" value="${escapeAttr(d.amount)}" oninput="txDraft.amount=this.value;this.classList.remove('invalid')">
      <span>${escapeHtml(state.finance.currency)}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <label style="margin:0">Catégorie</label>
      <button type="button" class="btn btn-sm btn-soft" onclick="openCategoryManager('${d.type}', () => openTxForm(null,null,true))">${ic('edit')}Gérer</button>
    </div>
    <div class="cat-grid">
      ${state.finance.categories[d.type].map(c => `
        <button type="button" class="cat-opt ${d.category === c.id ? 'on' : ''}" style="--k:${c.color}" onclick="txPickCat(this,'${c.id}')">
          <span class="icon-tile sm" style="--k:${c.color}">${ic(c.icon)}</span>${escapeHtml(c.label)}
        </button>`).join('')}
    </div>
    <label for="tx-label">Libellé (facultatif)</label>
    <input id="tx-label" value="${escapeAttr(d.label)}" placeholder="${d.type === 'income' ? 'Ex : Paiement client' : 'Ex : Courses du marché'}" oninput="txDraft.label=this.value">
    <label for="tx-date">Date</label>
    <input id="tx-date" type="date" value="${d.date}" onchange="txDraft.date=this.value">
    <div class="modal-actions">
      ${d.id ? `<button class="btn btn-danger-outline btn-icon" onclick="deleteTx('${d.id}')" aria-label="Supprimer">${ic('trash')}</button>` : `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>`}
      <button class="btn btn-primary" onclick="saveTx()">Enregistrer</button>
    </div>
  `, { instant: keep });
  if (!keep && !d.id) setTimeout(() => document.getElementById('tx-amount')?.focus(), 60);
}
function txSetType(t) {
  txDraft.type = t;
  if (!state.finance.categories[t].some(c => c.id === txDraft.category)) txDraft.category = state.finance.categories[t][0].id;
  openTxForm(null, null, true);
}
function txPickCat(el, id) {
  txDraft.category = id;
  el.parentElement.querySelectorAll('.cat-opt').forEach(b => b.classList.toggle('on', b === el));
}
function saveTx() {
  const d = txDraft;
  const amount = parseAmount(d.amount);
  if (!amount) { flagInvalid('tx-amount'); return; }
  const rec = { id: d.id || uid(), type: d.type, amount, category: d.category, label: (d.label || '').trim(), date: d.date || dateKey(new Date()), ts: d.ts || Date.now() };
  const list = state.finance.transactions;
  const i = list.findIndex(t => t.id === rec.id);
  if (i >= 0) list[i] = { ...list[i], ...rec }; else list.push(rec);
  saveState();
  closeModal();
  // affiche le mois du mouvement enregistré
  const now = new Date(), dd = new Date(rec.date + 'T00:00:00');
  financeMonthOffset = (dd.getFullYear() - now.getFullYear()) * 12 + dd.getMonth() - now.getMonth();
  financeTab = 'budget';
  if (currentScreen !== 'finance') navigate('finance'); else render();
}
function deleteTx(id) {
  askConfirm({
    title: 'Supprimer ce mouvement ?',
    onCancel: () => openTxForm(null, null, true),
    onConfirm: () => {
      state.finance.transactions = state.finance.transactions.filter(t => t.id !== id);
      state.finance.debts.forEach(d => d.payments.forEach(p => { if (p.txId === id) delete p.txId; }));
      saveState();
      render();
    }
  });
}

// --- Gestion des catégories de transactions ---
let catMgrType = 'expense';
let catMgrOnClose = null;
function openCategoryManager(type, onClose) {
  const freshOpen = !document.getElementById('modal-overlay');
  catMgrType = type || catMgrType || 'expense';
  if (onClose !== undefined) catMgrOnClose = onClose;
  renderCategoryManager(!freshOpen);
}
function closeCategoryManager() {
  const cb = catMgrOnClose; catMgrOnClose = null;
  closeModal();
  if (cb) cb(); else render();
}
function renderCategoryManager(instant) {
  const type = catMgrType;
  const list = state.finance.categories[type];
  openSheet(`
    <div class="modal-title">Catégories</div>
    <div class="tabs2" style="margin-top:16px">
      <button class="${type === 'expense' ? 'on' : ''}" onclick="openCategoryManager('expense')">Dépenses</button>
      <button class="${type === 'income' ? 'on' : ''}" onclick="openCategoryManager('income')">Entrées</button>
    </div>
    <div class="card" style="padding:6px 16px;margin-top:14px">
      ${list.map(c => `
        <div class="task-row">
          <span class="icon-tile sm" style="--k:${c.color}">${ic(c.icon)}</span>
          <span class="task-label">${escapeHtml(c.label)}</span>
          <button class="icon-btn mini" onclick="openCategoryForm('${type}','${c.id}')" aria-label="Modifier">${ic('edit')}</button>
          ${list.length > 1 ? `<button class="icon-btn mini" onclick="deleteCategory('${type}','${c.id}')" aria-label="Supprimer">${ic('trash')}</button>` : ''}
        </div>`).join('')}
    </div>
    <button class="btn btn-dashed btn-block" style="margin-top:14px" onclick="openCategoryForm('${type}',null)">${ic('plus')}Ajouter une catégorie</button>
    <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeCategoryManager()">Fermer</button></div>
  `, { instant });
}
let catDraft = null;
function openCategoryForm(type, id, keep) {
  if (!keep) {
    const c = id ? state.finance.categories[type].find(x => x.id === id) : null;
    catDraft = c ? { type, id: c.id, label: c.label, icon: c.icon, color: c.color }
      : { type, id: null, label: '', icon: FIN_CAT_ICONS[0], color: FIN_CAT_COLORS[state.finance.categories[type].length % FIN_CAT_COLORS.length] };
  }
  const d = catDraft;
  const canDelete = d.id && state.finance.categories[type].length > 1;
  openSheet(`
    <div class="modal-title">${d.id ? 'Modifier la catégorie' : 'Nouvelle catégorie'}</div>
    <label for="cat-label">Nom</label>
    <input id="cat-label" value="${escapeAttr(d.label)}" placeholder="Ex : Cadeaux" oninput="catDraft.label=this.value;this.classList.remove('invalid')">
    <label>Icône</label>
    <div class="cat-grid">
      ${FIN_CAT_ICONS.map(i => `
        <button type="button" class="cat-opt ${d.icon === i ? 'on' : ''}" style="--k:${d.color}" onclick="catDraft.icon='${i}';openCategoryForm('${type}',${d.id ? `'${d.id}'` : null},true)">
          <span class="icon-tile sm" style="--k:${d.color}">${ic(i)}</span>
        </button>`).join('')}
    </div>
    <label>Couleur</label>
    <div class="color-grid">
      ${FIN_CAT_COLORS.map(k => `
        <button type="button" class="color-opt ${d.color === k ? 'on' : ''}" style="--k:${k}" aria-label="Choisir cette couleur" onclick="catDraft.color='${k}';openCategoryForm('${type}',${d.id ? `'${d.id}'` : null},true)"></button>`).join('')}
    </div>
    <div class="modal-actions">
      ${canDelete ? `<button class="btn btn-danger-outline btn-icon" onclick="deleteCategory('${type}','${d.id}')" aria-label="Supprimer">${ic('trash')}</button>` : `<button class="btn btn-ghost" onclick="openCategoryManager('${type}')">Annuler</button>`}
      <button class="btn btn-primary" onclick="saveCategory()">Enregistrer</button>
    </div>
  `, { instant: keep });
  if (!keep) setTimeout(() => document.getElementById('cat-label')?.focus(), 60);
}
function saveCategory() {
  const d = catDraft;
  const label = document.getElementById('cat-label').value.trim();
  if (!label) { flagInvalid('cat-label'); return; }
  const list = state.finance.categories[d.type];
  if (d.id) {
    Object.assign(list.find(x => x.id === d.id), { label, icon: d.icon, color: d.color });
  } else {
    list.push({ id: uid(), label, icon: d.icon, color: d.color });
  }
  saveState();
  openCategoryManager(d.type);
}
function deleteCategory(type, id) {
  const list = state.finance.categories[type];
  if (list.length <= 1) return;
  const c = list.find(x => x.id === id);
  askConfirm({
    title: 'Supprimer cette catégorie ?',
    message: `${escapeHtml(c.label)}. Les mouvements existants seront reclassés dans une autre catégorie.`,
    onCancel: () => openCategoryForm(type, id),
    onConfirm: () => {
      state.finance.categories[type] = list.filter(x => x.id !== id);
      const fallback = state.finance.categories[type].find(x => x.id === 'other') || state.finance.categories[type][0];
      state.finance.transactions.forEach(t => { if (t.type === type && t.category === id) t.category = fallback.id; });
      saveState();
      openCategoryManager(type);
    }
  });
}

// --- Prêt / emprunt ---
let debtDraft = null;
function openDebtForm(id, direction, keep) {
  const today = dateKey(new Date());
  if (!keep) {
    const d = id ? findDebt(id) : null;
    const nextMonth = (() => { const x = new Date(today + 'T00:00:00'); x.setMonth(x.getMonth() + 1); return dateKey(x); })();
    debtDraft = d
      ? { id: d.id, direction: d.direction, person: d.person, amount: String(d.amount), date: d.date, label: d.label || '',
          mode: d.schedule && d.schedule.length ? 'multi' : 'once', dueDate: d.dueDate || '',
          count: (d.schedule && d.schedule.length) || 3, freq: d.freq || 'month', first: (d.schedule && d.schedule[0] && d.schedule[0].date) || nextMonth }
      : { id: null, direction: direction || 'lent', person: '', amount: '', date: today, label: '', mode: 'once', dueDate: '', count: 3, freq: 'month', first: nextMonth, addToBudget: true };
  }
  const d = debtDraft;
  const lent = d.direction === 'lent';
  const amt = parseAmount(d.amount);
  const preview = d.mode === 'multi' && amt ? makeSchedule(amt, d.count, d.first || today, d.freq) : [];
  openSheet(`
    <div class="modal-title">${d.id ? 'Modifier' : lent ? 'Nouveau prêt' : 'Nouvel emprunt'}</div>
    <div class="tabs2" style="margin-top:16px">
      <button class="${lent ? 'on' : ''}" onclick="debtDraft.direction='lent';openDebtForm(null,null,true)">J'ai prêté</button>
      <button class="${!lent ? 'on' : ''}" onclick="debtDraft.direction='borrowed';openDebtForm(null,null,true)">J'ai emprunté</button>
    </div>

function saveDebt() {
  const d = debtDraft;
  const amount = parseAmount(d.amount);
  if (!d.person.trim()) { flagInvalid('db-person'); return; }
  if (!amount) { flagInvalid('db-amount'); return; }
  const today = dateKey(new Date());
  const existing = d.id ? findDebt(d.id) : null;
  const rec = existing || { id: uid(), payments: [], createdAt: Date.now() };
  Object.assign(rec, {
    direction: d.direction, person: d.person.trim(), amount, date: d.date || today, label: (d.label || '').trim(), freq: d.freq,
    dueDate: d.mode === 'once' ? (d.dueDate || '') : '',
    schedule: d.mode === 'multi' ? makeSchedule(amount, d.count, d.first || today, d.freq) : [],
  });
  if (debtRemaining(rec) > 0) delete rec.settledAt;
  if (!existing && d.addToBudget) {
    const lent = d.direction === 'lent';
    const tx = { id: uid(), type: lent ? 'expense' : 'income', amount, category: 'loan', label: `${lent ? 'Prêt à' : 'Emprunt auprès de'} ${rec.person}`, date: rec.date, ts: Date.now(), debtId: rec.id };
    state.finance.transactions.push(tx);
    rec.txId = tx.id;
  }
  if (!existing) state.finance.debts.push(rec);
  saveState();
  financeTab = 'debts';
  if (currentScreen !== 'finance') navigate('finance'); else render();
  openDebtDetail(rec.id);
}
function deleteDebt(id) {
  const d = findDebt(id);
  askConfirm({
    title: 'Supprimer ce suivi ?',
    message: `${escapeHtml(d.person)} · ${money(d.amount)}. Les mouvements déjà ajoutés au budget sont conservés.`,
    onCancel: () => openDebtDetail(id),
    onConfirm: () => {
      state.finance.debts = state.finance.debts.filter(x => x.id !== id);
      saveState();
      render();
    }
  });
}

  openSheet(`
    <div class="sheet-head">

      <div style="flex:1;min-width:0">

        <div class="modal-sub">${lent ? 'Prêt' : 'Emprunt'} de ${money(d.amount)} le ${fmtDate(d.date, { day: 'numeric', month: 'long' })}${d.label ? ' · ' + escapeHtml(d.label) : ''}${d.txId ? ' · Ajouté au budget' : ''}</div>
      </div>

    ${sched.length ? `

    : d.dueDate && rem > 0 ? `<div class="ob-summary">${ic('bell')}<span>À rembourser avant le ${fmtDate(d.dueDate, { day: 'numeric', month: 'long' })} · ${dueLabel(daysBetween(today, d.dueDate))}</span></div>` : ''}

    <div class="section-head"><h2>Paiements</h2><span class="aside">${payments.length}</span></div>
    ${payments.length ? `<div class="card" style="padding:6px 16px">${payments.map(p => `

    <div class="modal-actions">

      <button class="btn btn-ghost" onclick="closeModal();render()">Fermer</button>

function openPaymentForm(id) {
  const d = findDebt(id);
  const lent = d.direction === 'lent';
  const rem = debtRemaining(d);
  const next = debtNextDue(d);
  const suggested = next ? next.amount : rem;
  openSheet(`

    <label for="pay-amount">Montant</label>
    <div class="amount-field">

    </div>
    <div class="seg" style="margin-top:10px">
      ${next && next.amount !== rem ? `<button onclick="document.getElementById('pay-amount').value=${next.amount}">Échéance · ${money(next.amount)}</button>` : ''}

    </div>
    <div class="row" style="padding:16px 0 0;border:none">
      <div class="row-main"><div class="row-title">Ajouter au budget</div><div class="row-sub">Compter ce paiement comme ${lent ? 'une entrée' : 'une dépense'} du mois</div></div>
      <button class="switch" id="pay-tx" role="switch" aria-checked="false" aria-label="Ajouter au budget" onclick="this.classList.toggle('on');this.setAttribute('aria-checked',this.classList.contains('on'))"></button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="openDebtDetail('${id}')">Annuler</button>

  `);

function savePayment(id) {
  const d = findDebt(id);
  let amount = parseAmount(document.getElementById('pay-amount').value);
  if (!amount) { flagInvalid('pay-amount'); return; }
  amount = Math.min(amount, debtRemaining(d));
  const date = document.getElementById('pay-date').value || dateKey(new Date());
  const note = document.getElementById('pay-note').value.trim();
  const pay = { id: uid(), amount, date, note };
  if (document.getElementById('pay-tx').classList.contains('on')) {
    const lent = d.direction === 'lent';
    const tx = { id: uid(), type: lent ? 'income' : 'expense', amount, category: 'repay', label: `${lent ? 'Remboursement de' : 'Remboursement à'} ${d.person}`, date, ts: Date.now(), debtId: id };
    state.finance.transactions.push(tx);
    pay.txId = tx.id;
  }
  d.payments.push(pay);
  if (debtRemaining(d) <= 0) d.settledAt = date;
  saveState();
  render();
  openDebtDetail(id, true);
}
function deletePayment(debtId, payId) {
  const d = findDebt(debtId);
  const p = d.payments.find(x => x.id === payId);
  askConfirm({
    title: 'Supprimer ce paiement ?',
    message: `${money(p.amount)} du ${fmtDate(p.date, { day: 'numeric', month: 'long' })}${p.txId ? '. Le mouvement ajouté au budget sera aussi supprimé.' : ''}`,
    onCancel: () => openDebtDetail(debtId, true),
    onConfirm: () => {
      d.payments = d.payments.filter(x => x.id !== payId);
      if (p.txId) state.finance.transactions = state.finance.transactions.filter(t => t.id !== p.txId);
      if (debtRemaining(d) > 0) delete d.settledAt;
      saveState();
      render();
      openDebtDetail(debtId, true);
    }
  });
}
function setCurrency(c) { state.finance.currency = c; saveState(); render(); }
function stepRemindDays(delta) {
  state.finance.remindDays = Math.max(0, Math.min(14, (state.finance.remindDays ?? 3) + delta));
  saveState();
  render();
}

// ===================== APPLICATION (PWA) =====================
// var : ces valeurs peuvent être lues par saveState() pendant les migrations, avant cette ligne
var swReg = null, installPrompt = null, reminderSyncTimer = null;
function canUseSW() {
  return 'serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname));
}
function isStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function refreshSettings() { if (currentScreen === 'settings') render(); }

function initPWA() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; refreshSettings(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; refreshSettings(); });
  if (!canUseSW()) return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    swReg = reg;
    syncRemindersToSW();
    registerPeriodicSync();
    refreshSettings();
  }).catch(e => console.warn('Service worker non enregistré', e));
  navigator.serviceWorker.addEventListener('controllerchange', refreshSettings);
  // données locales : demander au navigateur de ne pas les effacer
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  installPrompt.userChoice.finally(() => { installPrompt = null; render(); });
}
// Rappels app fermée : Chrome / Edge Android, app installée
async function registerPeriodicSync() {
  try {
    if (!swReg || !('periodicSync' in swReg)) return false;
    if (!notifSupported() || Notification.permission !== 'granted') return false;
    const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (st.state !== 'granted') return false;
    await swReg.periodicSync.register('inlife-reminders', { minInterval: 12 * 60 * 60 * 1000 });
    return true;
  } catch (e) { return false; }
}
// Le service worker ne lit pas le localStorage : on lui prépare la liste des échéances dans le cache
function syncRemindersToSW() {
  if (!canUseSW() || !('caches' in window)) return;
  clearTimeout(reminderSyncTimer);
  reminderSyncTimer = setTimeout(async () => {
    try {
      const items = [];
      state.finance.debts.forEach(d => {
        const rem = debtRemaining(d);
        if (rem <= 0) return;
        const text = amt => d.direction === 'lent' ? `${d.person} doit te rembourser ${money(amt)}` : `Rembourser ${money(amt)} à ${d.person}`;
        const open = debtSchedule(d).filter(x => x.status !== 'paid');
        if (open.length) open.forEach(x => items.push({ date: x.date, text: text(x.left) }));
        else if (d.dueDate) items.push({ date: d.dueDate, text: text(rem) });
      });
      const cache = await caches.open('inlife-data');
      const prev = await cache.match('./__reminders.json').then(r => r ? r.json() : {}).catch(() => ({}));
      const lastNotified = [prev.lastNotified, state.finance.lastNotified].filter(Boolean).sort().pop() || null;
      await cache.put('./__reminders.json', new Response(
        JSON.stringify({ items, remindDays: state.finance.remindDays ?? 3, lastNotified }),
        { headers: { 'Content-Type': 'application/json' } }
      ));
    } catch (e) { /* cache indisponible */ }
  }, 600);
}

function renderAppSection() {
  let install;
  if (isStandalone()) install = { sub: 'Installée sur cet appareil', action: '' };
  else if (installPrompt) install = { sub: 'Ajoute Inlife à ton écran d\'accueil, comme une vraie app', action: `<button class="btn btn-sm btn-primary" onclick="installApp()">Installer</button>` };
  else if (isIOS()) install = { sub: 'Dans Safari : bouton Partager, puis « Sur l\'écran d\'accueil »', action: '' };
  else if (!canUseSW()) install = { sub: 'Ouvre l\'app depuis son adresse web (https) pour pouvoir l\'installer', action: '' };
  else install = { sub: 'Menu du navigateur › « Installer l\'application »', action: '' };
  const controlled = canUseSW() && navigator.serviceWorker.controller;
  const offline = controlled ? 'Prête : l\'app et tes données fonctionnent sans connexion'
    : canUseSW() ? 'Préparation… recharge la page une fois' : 'Indisponible quand le fichier est ouvert directement';
  return `
    <div class="section-head"><h2>Application</h2></div>
    <div class="group">
      <div class="row">
        <span class="icon-tile sm solid" style="--k:var(--primary)">${ic('download')}</span>
        <div class="row-main"><div class="row-title">Installer Inlife</div><div class="row-sub">${install.sub}</div></div>
        ${install.action}
      </div>
      <div class="row">
        <span class="icon-tile sm" style="--k:${controlled ? 'var(--mint)' : 'var(--ink-3)'}">${ic(controlled ? 'check' : 'clock')}</span>
        <div class="row-main"><div class="row-title">Mode hors ligne</div><div class="row-sub">${offline}</div></div>
      </div>
    </div>`;
}

// --- Sauvegarde / restauration ---
function exportData() {
  const payload = { app: 'inlife', version: 1, exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `inlife-sauvegarde-${dateKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  file.text().then(txt => {
    let data = null;
    try { data = JSON.parse(txt); } catch (e) { /* fichier illisible */ }
    const s = data && (data.state || data);
    if (!s || !s.program || !s.dayTypes || !s.projects) {
      openSheet(`
        <div class="sheet-head"><span class="icon-tile" style="--k:var(--rose)">${ic('alert')}</span>
          <div><div class="modal-title">Fichier non reconnu</div><div class="modal-sub">Choisis un fichier de sauvegarde exporté depuis Inlife (inlife-sauvegarde-….json).</div></div></div>
        <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeModal()">Fermer</button></div>`);
      return;
    }
    const when = data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'date inconnue';
    askConfirm({
      title: 'Remplacer tes données ?',
      message: `Sauvegarde du ${when}. Toutes les données actuelles de cet appareil seront remplacées.`,
      confirmLabel: 'Importer',
      onConfirm: () => { localStorage.setItem(STORE_KEY, JSON.stringify(s)); location.reload(); },
    });
  });
}

const APPEARANCES = {
  system: { label: 'Système', icon: 'monitor', sub: 'Suit le réglage de ton appareil' },
  light:  { label: 'Clair', icon: 'sun', sub: 'Toujours clair' },

};
function applyAppearance() {
  const a = APPEARANCES[state.settings.appearance] ? state.settings.appearance : 'system';
  const root = document.documentElement;
  if (a === 'system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', a);
  // couleur de la barre du navigateur sur mobile
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    const dark = a === 'system' ? m.media.includes('dark') : a === 'dark';
    m.setAttribute('content', dark ? '#0D0F1E' : '#F3F4FA');
  });
}
function setAppearance(a) {
  state.settings.appearance = a;
  saveState();
  applyAppearance();
  render();
}

// ===================== RENDER PRINCIPAL =====================
function render() {
  const appEl = document.getElementById('app');
  if (!state.program.configured) {
    if (!ob) startOnboarding();
    document.getElementById('bottomnav').innerHTML = '';
    appEl.classList.add('ob-mode');
    renderOnboarding();
    return;
  }
  appEl.classList.remove('ob-mode');
  renderBottomNav();

  else if (currentScreen === 'journal') renderJournalScreen();
  else if (currentScreen === 'planning') renderPlanning();
  else if (currentScreen === 'projects') renderProjects();
  else if (currentScreen === 'project_detail') renderProjectDetail();
  else if (currentScreen === 'stats') renderStats();
  else if (currentScreen === 'settings') renderSettings();
  else if (currentScreen === 'program') renderProgram();
  else if (currentScreen === 'finance') renderFinance();
}

applyAppearance();
{
  const wanted = new URLSearchParams(location.search).get('screen');
  if (['today', 'finance', 'planning', 'projects', 'stats', 'settings'].includes(wanted)) currentScreen = wanted;
}
render();
initPWA();
checkFinanceNotifications();
// Rafraîchit l'écran du jour chaque minute, sauf pendant une saisie ou une modale ouverte
setInterval(() => {
  const a = document.activeElement;
  const typing = a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName);
  if (currentScreen === 'today' && state.program.configured && !typing && !document.getElementById('modal-overlay')) renderToday();
}, 60000);

</script>
