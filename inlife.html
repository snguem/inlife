  const k = kindOf(block);
  const projs = blockProjects(block);
  const rt = blockRoutine(block);
  const choice = (st) => `
    <button class="status-choice ${st} ${log?.status===st?'on':''}" onclick="setLog('${dk}','${blockId}','${st}');closeModal();render();">
      <span class="circ">${ic(STATUS[st].icon)}</span>${STATUS[st].label}
    </button>`;
  openSheet(`
    <div class="sheet-head">
      <span class="icon-tile solid" style="--k:${k.color}">${ic(k.icon)}</span>
      <div>
        <div class="modal-title">${escapeHtml(block.title)}</div>
        <div class="modal-sub">${block.start} – ${block.end} · ${fmtDuration(timeToMin(block.end) - timeToMin(block.start))}</div>
      </div>
    </div>
    ${block.sub ? `<p style="font-size:15px;color:var(--ink-2);margin-bottom:18px;">${escapeHtml(block.sub)}</p>` : ''}
    ${projs.length ? `<p class="chips" style="margin-bottom:18px;">${projs.map(p => `<span class="badge primary">${ic('folder')}${escapeHtml(p.name)}</span>`).join('')}</p>
      <p class="muted-note" style="margin:-10px 0 14px">Fait : ${fmtDuration(timeToMin(block.end) - timeToMin(block.start))} ajoutées au temps ${projs.length > 1 ? 'des projets, réparties' : 'du projet'}. Partiel : la moitié.</p>` : ''}
    ${rt && rt.tasks.length ? `<div class="label" style="margin-top:0">Tâches</div>${renderTaskStrip(dk, block, rt, 'modal', true)}` : ''}
    <div class="label" style="margin-top:0">Comment ça s'est passé ?</div>
    <div class="status-choices">${choice('done')}${choice('partial')}${choice('missed')}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
      <button class="btn btn-soft" onclick="openDayEditor('${dk}')">${ic('edit')}Modifier le jour</button>
    </div>
  `, instant ? { instant: true } : undefined);
  if (restoreStrips) restoreStrips();
}

// ===================== ECRAN: CARNET =====================
function journalStreak() {
  let n = 0, k = dateKey(new Date());
  if (!hasJournalEntry(k)) k = addDays(k, -1);
  while (hasJournalEntry(k)) { n++; k = addDays(k, -1); }
  return n;
}
function renderJournalEntry(dk) {
  const j = state.journal[dk];
  return `
    <button class="entry" onclick="openJournalDayModal('${dk}')">
      <div class="entry-date"><b>${fmtDate(dk, { day: 'numeric' })}</b><span>${fmtDate(dk, { month: 'short' })}</span></div>
      <div class="entry-main">
        <div class="entry-dow">${fmtDate(dk, { weekday: 'long' })}</div>
        <p class="entry-prio">${j.priorite ? escapeHtml(j.priorite) : '<span style="color:var(--ink-3)">Pas de priorité notée</span>'}</p>
        ${j.emotion ? `<span class="badge dot" style="--k:var(--k-social)">${escapeHtml(j.emotion)}</span>` : ''}
      </div>
    </button>`;
}
function renderJournalScreen() {
  const todayKey = dateKey(new Date());
  const days = Object.keys(state.journal).filter(hasJournalEntry).filter(k => k !== todayKey).sort().reverse();
  const streak = journalStreak();
  let html = `
    <div class="screen-head" style="align-items:center;margin-bottom:8px">${backButton('journal')}</div>
    ${screenHead('Carnet', `${Object.keys(state.journal).filter(hasJournalEntry).length} entrées${streak ? ` · série de ${streak} jour${streak>1?'s':''}` : ''}`)}
    <div class="card">${renderJournalForm(todayKey)}</div>
    <div class="section-head">
      <h2>Historique</h2>
      ${days.length > 20 ? `<button class="btn btn-sm btn-soft" onclick="openAllJournalModal()">Tout voir</button>` : ''}
    </div>
  `;
  if (!days.length) {
    html += `<div class="empty-state"><span class="icon-tile" style="--k:var(--k-social)">${ic('book')}</span><b>Ton historique commence ici</b>Chaque jour rempli s'ajoutera à cette liste.</div>`;
  } else {
    html += days.slice(0, 20).map(renderJournalEntry).join('');
  }
  document.getElementById('app').innerHTML = html;
}

function openAllJournalModal() {
  const days = Object.keys(state.journal).filter(hasJournalEntry).sort().reverse();
  openSheet(`
    <div class="modal-title" style="margin-bottom:16px">Tous les jours</div>
    ${days.length ? days.map(renderJournalEntry).join('') : `<div class="empty-state">Aucune entrée.</div>`}
    <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeModal()">Fermer</button></div>
  `);
}

function openJournalDayModal(dk) {
  const j = state.journal[dk] || {};
  const row = (icon, color, label, val) => `
    <div class="journal-view">
      <div class="label"><span class="field-ic" style="--k:${color}">${ic(icon)}</span>${label}</div>
      <p>${val ? escapeHtml(val) : '<span style="color:var(--ink-3)">—</span>'}</p>
    </div>`;
  openSheet(`
    <div class="modal-title" style="margin-bottom:18px">${fmtDate(dk, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    ${row('target', 'var(--k-ritual)', 'Priorité du jour', j.priorite)}
    ${row('heart', 'var(--k-social)', 'État émotionnel', j.emotion)}
    ${row('compass', 'var(--k-sport)', 'Intention de comportement', j.intention)}
    <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeModal()">Fermer</button></div>
  `);
}

// ===================== ECRAN: CALENDRIER (mois) =====================
function renderPlanning() {
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + currentMonthOffset);
  const year = base.getFullYear(), month = base.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = dateKey(new Date());

  const scores = [];
  let cells = '';
  for (let day = 1; day <= daysInMonth; day++) {
    const dk = `${year}-${pad(month+1)}-${pad(day)}`;
    const sc = trackedScore(dk);
    if (sc !== null) scores.push(sc);
    const tone = scoreTone(sc);
    let cls = tone ? `t-${tone}` : (dk < todayKey ? 'untracked' : '');
    if (dk === todayKey) cls += ' is-today';
    if (state.dayOverrides[dk]) cls += ' custom';
    cells += `<button class="cal-cell ${cls}" onclick="openDayDetail('${dk}')" aria-label="${fmtDate(dk,{day:'numeric',month:'long'})}${sc!==null?', '+sc+'%':''}">
      ${day}${hasJournalEntry(dk) ? '<i class="jdot"></i>' : ''}
    </button>`;
  }

  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const html = `
    ${screenHead('Calendrier', 'Touche un jour pour voir ou modifier son déroulé', settingsBtn)}
    <div class="stat-grid">
      ${statTile('target', 'var(--primary)', avg + '%', 'Moyenne du mois')}
      ${statTile('trophy', 'var(--mint)', scores.filter(s=>s>=80).length, 'Jours ≥ 80 %')}
      ${statTile('calendar', 'var(--k-ritual)', scores.length, 'Jours suivis')}
    </div>
    <div class="card" style="margin-top:14px">
      <div class="month-nav">
        <button class="icon-btn" onclick="currentMonthOffset--;render()" aria-label="Mois précédent">${ic('chevL')}</button>
        <h2>${base.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2>
        <button class="icon-btn" onclick="currentMonthOffset++;render()" aria-label="Mois suivant">${ic('chevR')}</button>
      </div>
      <div class="month-grid">
        ${['L','M','M','J','V','S','D'].map(d=>`<div class="dow-label">${d}</div>`).join('')}
        ${Array(startOffset).fill('<div></div>').join('')}
        ${cells}
      </div>
      <div class="legend">
        <span><i style="background:var(--mint)"></i>≥ 80 %</span>
        <span><i style="background:var(--amber)"></i>40 – 79 %</span>
        <span><i style="background:var(--rose)"></i>&lt; 40 %</span>
        <span><i style="background:var(--k-social);border-radius:50%;width:8px;height:8px"></i>Carnet rempli</span>
        <span><i style="background:var(--primary);border-radius:50%;width:8px;height:8px"></i>Déroulé personnalisé</span>
      </div>
    </div>
    ${currentMonthOffset !== 0 ? `<button class="btn btn-soft btn-block" onclick="currentMonthOffset=0;render()">Revenir à aujourd'hui</button>` : ''}
  `;
  document.getElementById('app').innerHTML = html;
}

function statTile(icon, color, num, label, extraCls = '') {
  return `<div class="stat ${extraCls}" style="--k:${color}">
    <span class="icon-tile">${ic(icon)}</span>
    <div class="stat-num">${num}</div>
    <div class="stat-label">${label}</div>
  </div>`;
}

function openDayDetail(dk) {
  const dt = getDayTypeForDate(dk);
  const sc = trackedScore(dk);
  const rows = dt.blocks.map(b => {
    const log = getLog(dk, b.id);
    const st = log ? log.status : 'pending';
    const k = kindOf(b);
    const projs = blockProjects(b);
    return `<div class="task-row">
      <span class="icon-tile sm" style="--k:${k.color}">${ic(k.icon)}</span>
      <span class="task-label">${escapeHtml(b.title)}<br><span style="font-size:12px;color:var(--ink-3);font-weight:600">${b.start} – ${b.end}</span>
        ${projs.length ? `<span class="block-projs">${projs.map(p => `<span>${ic('folder')}${escapeHtml(p.name)}</span>`).join('')}</span>` : ''}
      </span>
      <span class="badge ${st==='pending'?'':st}">${STATUS[st].label}</span>
    </div>`;
  }).join('');
  openSheet(`
    <div class="sheet-head" style="justify-content:space-between">
      <div class="modal-title">${fmtDate(dk, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
      ${sc !== null ? `<span class="badge ${sc>=80?'done':sc>=40?'partial':'missed'}" style="font-size:14px">${sc}%</span>` : ''}
    </div>
    <div class="label" style="margin-top:0">Type de jour</div>
    <div class="seg">
      ${state.dayTypes.map(t => `<button class="${dt.id===t.id?'on':''}" onclick="assignDayType('${dk}','${t.id}')">${escapeHtml(t.name)}</button>`).join('')}
    </div>
    <div class="section-head" style="margin:22px 0 10px">
      <h2 style="font-size:17px">Déroulé${dt.custom ? ' <span class="badge primary" style="vertical-align:middle">Personnalisé</span>' : ''}</h2>
      <span class="aside">${dt.blocks.length} bloc${dt.blocks.length>1?'s':''}</span>
    </div>
    <div class="card" style="padding:6px 16px">
      ${rows || '<p class="muted-note">Aucun bloc ce jour-là.</p>'}
    </div>
    <button class="btn btn-primary btn-block" onclick="openDayEditor('${dk}')">${ic('edit')}Modifier le déroulé de ce jour</button>
    ${hasJournalEntry(dk) ? `<button class="btn btn-soft btn-block" style="margin-top:10px" onclick="openJournalDayModal('${dk}')">${ic('book')}Voir le carnet</button>` : ''}
    <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeModal()">Fermer</button></div>
  `);
}
function assignDayType(dk, dayTypeId) {
  const apply = () => {
    state.assignments[dk] = dayTypeId;
    delete state.dayOverrides[dk];
    saveState();
    render();
    openDayDetail(dk);
  };
  if (state.dayOverrides[dk] && getDayTypeForDate(dk).id !== dayTypeId) {
    askConfirm({
      title: 'Changer de jour-type ?',
      message: 'Ce jour a un déroulé personnalisé. Il sera remplacé par les blocs du nouveau jour-type.',
      confirmLabel: 'Changer',
      onConfirm: apply,
    });
  } else apply();
}

// ===================== JOURS-TYPE (gérés depuis Réglages) =====================
function renderDayTypesSection() {
  let html = `<div class="section-head"><h2>Jours-type</h2></div><div class="group">`;
  state.dayTypes.forEach(dt => {
    html += `
      <button class="row" onclick="openDayTypeEditor('${dt.id}')">
        <span class="icon-tile sm" style="--k:var(--primary)">${ic('layers')}</span>
        <div class="row-main">
          <div class="row-title">${escapeHtml(dt.name)}</div>
          <div class="row-sub">${dt.blocks.length} bloc${dt.blocks.length>1?'s':''}</div>
          ${dt.blocks.length ? `<div class="kind-dots">${dt.blocks.map(b => `<i style="background:${kindOf(b).color}"></i>`).join('')}</div>` : ''}
        </div>
        <span class="chev">${ic('chevR')}</span>
      </button>`;
  });
  html += `</div><button class="btn btn-dashed btn-block" onclick="createDayType()">${ic('plus')}Créer un jour-type</button>`;
  return html;
}
function createDayType() {
  askText({
    title: 'Nouveau jour-type', placeholder: 'Ex : Jour de voyage',
    onSubmit: (name) => {
      const newDt = { id: uid(), name, blocks: [] };
      state.dayTypes.push(newDt);
      saveState();
      render();
      openDayTypeEditor(newDt.id);
    }
  });
}

function openDayTypeEditor(dtId, instant) {
  if (!instant) openBlocks.clear();
  const dt = state.dayTypes.find(d => d.id === dtId);
  const canDelete = !['dt_semaine','dt_weekend','dt_ferie'].includes(dt.id);
  openSheet(`
    <div class="label" style="margin-top:0">Nom du jour-type</div>
    <input value="${escapeAttr(dt.name)}" style="font-size:18px;font-weight:700;margin-bottom:18px;" onchange="renameDayType('${dt.id}',this.value)">
    <div class="label">Ajouter un bloc</div>
    ${renderAddBlockBar('dt:' + dt.id)}
    <div class="label">Blocs</div>
    <div id="dt-blocks-list">
      ${dt.blocks.map(b => renderBlockEditRow('dt:' + dt.id, b)).join('') || '<p class="muted-note">Aucun bloc pour l\'instant.</p>'}
    </div>
    ${canDelete ? `<button class="btn btn-block btn-danger-outline" style="margin-top:10px;" onclick="deleteDayType('${dt.id}')">${ic('trash')}Supprimer ce jour-type</button>` : ''}
    <div class="modal-actions sticky"><button class="btn btn-primary btn-block" onclick="closeModal();render();">Terminé</button></div>
  `, instant ? { instant: true } : undefined);
}
function renameDayType(dtId, name) {
  const dt = state.dayTypes.find(d => d.id === dtId);
  dt.name = name;
  saveState();
}
function deleteDayType(dtId) {
  askConfirm({
    title: 'Supprimer ce jour-type ?',
    message: 'Les jours qui l’utilisent repasseront au type par défaut.',
    onConfirm: () => {
      state.dayTypes = state.dayTypes.filter(d => d.id !== dtId);
      Object.keys(state.assignments).forEach(dk => {
        if (state.assignments[dk] === dtId) delete state.assignments[dk];
      });
      saveState();
      render();
    }
  });
}
// ===================== EDITION DES BLOCS (jour-type ou jour précis) =====================
// target : 'dt:<id du jour-type>' ou 'day:<AAAA-MM-JJ>'
function blockContainer(target, forWrite) {
  const sep = target.indexOf(':');
  const kind = target.slice(0, sep), key = target.slice(sep + 1);
  if (kind === 'day') return forWrite ? ensureOverride(key) : getDayTypeForDate(key);
  return state.dayTypes.find(d => d.id === key);
}
// focusId : bloc à mettre en évidence (défilement + surbrillance) après réouverture
function reopenEditor(target, focusId) {
  if (target.startsWith('day:')) openDayEditor(target.slice(4), true);
  else openDayTypeEditor(target.slice(3), true);
  const el = focusId && document.getElementById('blk-' + focusId);
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('fresh'); }
}
function renderAddBlockBar(target) {
  return `<div class="add-bar">
    <button type="button" class="add-chip" onclick="addBlock('${target}')">${ic('plus')}Bloc libre</button>
    ${(state.routines || []).map(r => `<button type="button" class="add-chip" style="--k:${(KINDS[r.kind] || KINDS.ritual).color}" onclick="addBlock('${target}','${r.id}')">${ic('plus')}${escapeHtml(r.name)}<span>${fmtDuration(routineTotal(r))}</span></button>`).join('')}
  </div>`;
}
function blockProjectChips(target, b) {
  const ids = b.projectIds || [];
  if (!state.projects.length) return '';
  return `
      <div class="label" style="margin:4px 0 8px">${ic('folder')}Projets suivis sur ce bloc</div>
      <div class="proj-chips">
        ${state.projects.map(p => {
          const cat = state.categories.find(c => c.id === p.categoryId);
          return `<button type="button" class="proj-chip ${ids.includes(p.id) ? 'on' : ''}" style="--k:${catColor(cat)}" aria-pressed="${ids.includes(p.id)}" onclick="toggleBlockProject('${target}','${b.id}','${p.id}',this)">${escapeHtml(p.name)}</button>`;
        }).join('')}
      </div>`;
}
// Blocs repliables : seuls ceux listés dans openBlocks sont dépliés
const openBlocks = new Set();
function toggleBlockOpen(id, hdr) {
  const el = document.getElementById('blk-' + id);
  if (!el) return;
  const on = !el.classList.contains('open');
  el.classList.toggle('open', on);
  hdr.setAttribute('aria-expanded', on);
  if (on) openBlocks.add(id); else openBlocks.delete(id);
}
function blockEditShell(b, inner) {
  const open = openBlocks.has(b.id);
  const k = kindOf(b);
  return `
    <div class="block-edit ${open ? 'open' : ''}" id="blk-${b.id}" style="--k:${k.color}">
      <button type="button" class="be-head" aria-expanded="${open}" onclick="toggleBlockOpen('${b.id}',this)">
        <span class="be-chev">${ic('chevD')}</span>
        <span class="be-icon">${ic(k.icon)}</span>
        <span class="be-title" id="bt-${b.id}">${escapeHtml(b.title)}</span>
        <span class="be-time" id="bti-${b.id}">${b.start} – ${b.end}</span>
      </button>
      <div class="be-body">${inner}</div>
    </div>`;
}
function renderBlockEditRow(target, b) {
  const rt = blockRoutine(b);
  const remove = `<button class="btn btn-sm btn-danger-outline btn-block" style="margin-top:12px" onclick="removeBlock('${target}','${b.id}')">${ic('trash')}Supprimer ce bloc</button>`;
  if (rt) {
    // bloc-catégorie : seul le début est saisi, la fin découle des durées des tâches
    return blockEditShell(b, `
      <p class="muted-note" style="padding:0 0 8px">${rt.tasks.length} tâche${rt.tasks.length > 1 ? 's' : ''} · ${fmtDuration(routineTotal(rt))}</p>
      <div class="grid2">
        <input type="time" value="${b.start}" style="margin:0" aria-label="Début" onchange="updateBlockField('${target}','${b.id}','start',this.value)">
        <div class="end-auto">Fin<b id="end-${b.id}">${b.end}</b></div>
      </div>
      ${blockProjectChips(target, b)}
      ${remove}`);
  }
  return blockEditShell(b, `
      <div class="grid2">
        <input type="time" value="${b.start}" style="margin:0" aria-label="Début" onchange="updateBlockField('${target}','${b.id}','start',this.value)">
        <input type="time" value="${b.end}" style="margin:0" aria-label="Fin" onchange="updateBlockField('${target}','${b.id}','end',this.value)">
      </div>
      <input value="${escapeAttr(b.title)}" placeholder="Titre" style="font-weight:700" onchange="updateBlockField('${target}','${b.id}','title',this.value)">
      <input value="${escapeAttr(b.sub)}" placeholder="Détail" onchange="updateBlockField('${target}','${b.id}','sub',this.value)">
      <select aria-label="Type" onchange="updateBlockField('${target}','${b.id}','kind',this.value);this.closest('.block-edit').style.setProperty('--k', KINDS[this.value].color)">
        ${Object.entries(KINDS).map(([key, k]) => `<option value="${key}" ${(b.kind || 'other') === key ? 'selected' : ''}>${k.label}</option>`).join('')}
      </select>
      ${blockProjectChips(target, b)}
      ${remove}`);
}
function updateBlockField(target, blockId, field, val) {
  const c = blockContainer(target, true);
  const b = c.blocks.find(x => x.id === blockId);
  if (!b) return;
  b[field] = val;
  const rt = blockRoutine(b);
  if (rt && field === 'start') {
    b.end = routineEnd(b.start, rt);
    const endEl = document.getElementById('end-' + b.id);
    if (endEl) endEl.textContent = b.end;
  }
  const hTitle = document.getElementById('bt-' + b.id), hTime = document.getElementById('bti-' + b.id);
  if (hTitle) hTitle.textContent = b.title;
  if (hTime) hTime.textContent = `${b.start} – ${b.end}`;
  c.blocks.sort((a, d) => timeToMin(a.start) - timeToMin(d.start));
  saveState();
}
function toggleBlockProject(target, blockId, projId, el) {
  const c = blockContainer(target, true);
  const b = c.blocks.find(x => x.id === blockId);
  if (!b) return;
  b.projectIds = b.projectIds || [];
  const on = !b.projectIds.includes(projId);
  b.projectIds = on ? [...b.projectIds, projId] : b.projectIds.filter(id => id !== projId);
  saveState();
  if (el) { el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); }
}
// Ajoute à la fin de la liste, à la suite du dernier bloc (routineId : bloc-catégorie)
function addBlock(target, routineId) {
  const c = blockContainer(target, true);
  const lastEnd = c.blocks.reduce((m, b) => Math.max(m, timeToMin(b.end)), -1);
  const startMin = lastEnd < 0 ? 8 * 60 : Math.min(lastEnd, 23 * 60);
  const nb = { id: uid(), start: minToTime(startMin), end: minToTime(Math.min(startMin + 60, 23 * 60 + 59)), title: 'Nouveau bloc', sub: '', kind: 'other', projectIds: [] };
  const r = routineId && findRoutine(routineId);
  if (r) { nb.routineId = r.id; applyRoutineToBlock(nb, r); }
  c.blocks.push(nb);
  saveState();
  openBlocks.clear();
  openBlocks.add(nb.id);
  reopenEditor(target, nb.id);
}
function removeBlock(target, blockId) {
  const c = blockContainer(target, true);
  c.blocks = c.blocks.filter(b => b.id !== blockId);
  saveState();
  reopenEditor(target);
}

// Déroulé d'un jour précis (ne modifie pas le jour-type)
function openDayEditor(dk, instant) {
  if (!instant) openBlocks.clear();
  const dt = getDayTypeForDate(dk);
  const target = 'day:' + dk;
  openSheet(`
    <div class="sheet-head" style="margin-bottom:10px">
      <span class="icon-tile solid" style="--k:var(--primary)">${ic('calendar')}</span>
      <div style="flex:1;min-width:0">
        <div class="modal-title">${fmtDate(dk, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
        <div class="modal-sub">Basé sur « ${escapeHtml(dt.name)} »</div>
      </div>
      ${dt.custom ? '<span class="badge primary">Personnalisé</span>' : ''}
    </div>
    <div class="ob-summary" style="margin:0 0 18px">${ic('edit')}<span>Les changements ne concernent que ce jour. Le jour-type reste inchangé.</span></div>
    <div class="label">Ajouter un bloc</div>
    ${renderAddBlockBar(target)}
    ${dt.blocks.map(b => renderBlockEditRow(target, b)).join('') || '<p class="muted-note">Aucun bloc ce jour-là.</p>'}
    ${dt.custom ? `<button class="btn btn-block btn-danger-outline" style="margin-top:10px" onclick="resetDayOverride('${dk}')">Revenir au jour-type « ${escapeHtml(dt.name)} »</button>` : ''}
    <div class="modal-actions sticky"><button class="btn btn-primary btn-block" onclick="closeDayEditor('${dk}')">Terminé</button></div>
  `, instant ? { instant: true } : undefined);
}
function closeDayEditor(dk) {
  closeModal();
  render();
  if (currentScreen === 'planning') openDayDetail(dk);
}
function resetDayOverride(dk) {
  askConfirm({
    title: 'Revenir au jour-type ?',
    message: 'Les blocs personnalisés de ce jour seront remplacés par ceux du jour-type.',
    confirmLabel: 'Revenir',
    onConfirm: () => {
      delete state.dayOverrides[dk];
      saveState();
      render();
      openDayDetail(dk);
    }
  });
}

// ===================== ECRAN: PROJETS — DASHBOARD =====================
function projectProgress(p) {
  const allTasks = p.phases.flatMap(ph => ph.tasks);
  const done = allTasks.filter(t => t.done).length;
  return { done, total: allTasks.length, pct: allTasks.length ? Math.round(done/allTasks.length*100) : 0 };
}
function currentPhase(p) {
  return p.phases.find(ph => ph.id === p.currentPhaseId) || p.phases[0];
}

function renderProjects() {
  const total = state.projects.length;
  const urgentProjects = state.projects.filter(p => p.urgent);
  const totalTasks = state.projects.flatMap(p => p.phases.flatMap(ph => ph.tasks));
  const openTasks = totalTasks.filter(t => !t.done).length;

  let html = `
    ${screenHead('Projets', `${total} projet${total>1?'s':''} en suivi`, `<button class="icon-btn primary" onclick="addProject()" aria-label="Nouveau projet">${ic('plus')}</button>`)}
    <div class="stat-grid">
      ${statTile('folder', 'var(--primary)', total, 'Projets')}
      ${statTile('alert', 'var(--rose)', urgentProjects.length, 'Urgents', urgentProjects.length ? 'hot' : '')}
      ${statTile('list', 'var(--k-sport)', openTasks, 'Tâches ouvertes')}
    </div>
  `;

  if (!total) {
    html += `<div class="empty-state" style="margin-top:20px"><span class="icon-tile">${ic('folder')}</span><b>Aucun projet</b>Touchez + pour créer votre premier projet.</div>`;
  }

  if (urgentProjects.length) {
    html += `<div class="cat-head" style="--k:var(--rose)"><span class="cat-dot"></span><h2>Urgent</h2><span class="count-pill">${urgentProjects.length}</span></div>`;
    html += `<div class="proj-grid">${urgentProjects.map(renderProjCard).join('')}</div>`;
  }

  state.categories.forEach(cat => {
    const projs = state.projects.filter(p => p.categoryId === cat.id && !p.urgent);
    if (!projs.length) return;
    html += `<div class="cat-head" style="--k:${catColor(cat)}"><span class="cat-dot"></span><h2>${escapeHtml(cat.name)}</h2><span class="count-pill">${projs.length}</span></div>`;
    html += `<div class="proj-grid">${projs.map(renderProjCard).join('')}</div>`;
  });

  const orphan = state.projects.filter(p => !p.urgent && !state.categories.find(c=>c.id===p.categoryId));
  if (orphan.length) {
    html += `<div class="cat-head" style="--k:var(--c-gray)"><span class="cat-dot"></span><h2>Sans catégorie</h2></div>`;
    html += `<div class="proj-grid">${orphan.map(renderProjCard).join('')}</div>`;
  }
  document.getElementById('app').innerHTML = html;
}

function renderProjCard(p) {
  const prog = projectProgress(p);
  const cat = state.categories.find(c => c.id === p.categoryId);
  const color = catColor(cat);
  return `
    <button class="proj-card" style="--k:${color}" onclick="openProjectScreen('${p.id}')">
      <div class="top">
        <span class="icon-tile sm" style="--k:${color}">${ic('folder')}</span>
        ${p.urgent ? `<span class="badge urgent">Urgent</span>` : ''}
      </div>
      <div class="proj-name">${escapeHtml(p.name)}</div>
      <div class="proj-status">${escapeHtml(p.status)}</div>
      <div class="spacer"></div>
      <div class="progress"><div style="width:${prog.pct}%"></div></div>
      <div class="proj-meta"><span>${prog.total ? `${prog.done}/${prog.total} tâches` : 'Aucune tâche'}</span><span>${fmtDuration(p.totalMinutes||0)}</span></div>
    </button>
  `;
}

function addProject() {
  askText({
    title: 'Nouveau projet', placeholder: 'Nom du projet',
    onSubmit: (name) => {
      const categoryId = state.categories[0]?.id || null;
      const p = { id: uid(), name, categoryId, description: '', status: 'À démarrer', urgent: false, totalMinutes: 0, currentPhaseId: 'phase_default', phases: [{ id: 'phase_default', name: 'Général', tasks: [] }] };
      state.projects.push(p);
      saveState();
      projectInfoOpen = true;
      openProjectScreen(p.id);
    }
  });
}

// ===================== ECRAN DEDIE: DETAIL PROJET =====================
function openProjectScreen(projId) {
  currentScreen = 'project_detail';
  currentProjectId = projId;
  render();
  window.scrollTo(0, 0);
}

function renderProjectDetail() {
  const p = state.projects.find(x => x.id === currentProjectId);
  if (!p) { navigate('projects'); return; }
  const prog = projectProgress(p);
  const cat = state.categories.find(c => c.id === p.categoryId);
  const color = catColor(cat);
  const shownPhase = p.phases.find(ph => ph.id === viewedPhase[p.id]) || currentPhase(p);

  let html = `
    <div class="screen-head" style="align-items:center;margin-bottom:14px">
      <button class="back-btn" onclick="navigate('projects')">${ic('chevL')}Projets</button>
      <button class="btn btn-sm ${p.urgent?'btn-danger':''}" onclick="toggleUrgent('${p.id}')">${ic('alert')}${p.urgent?'Urgent':'Marquer urgent'}</button>
    </div>

    <section class="proj-hero" style="--k:${color}">
      <span class="badge dot" style="--k:${color};background:var(--surface)">${cat ? escapeHtml(cat.name) : 'Sans catégorie'}</span>
      <h1>${escapeHtml(p.name)}</h1>
      ${p.description ? `<p class="desc">${escapeHtml(p.description)}</p>` : ''}
      <div class="proj-hero-stats">
        <div><b>${prog.pct}%</b><span>Avancement</span></div>
        <div><b>${prog.done}/${prog.total}</b><span>Tâches</span></div>
        <div><b>${fmtDuration(p.totalMinutes||0)}</b><span>Temps cumulé</span></div>
      </div>
    </section>

    <div class="section-head" style="margin-top:6px"><h2>Phases</h2><span class="aside">${escapeHtml(p.status)}</span></div>
    <div class="phase-tabs" role="tablist">
      ${p.phases.map(ph => {
        const d = ph.tasks.filter(t => t.done).length;
        return `<button role="tab" aria-selected="${ph.id===shownPhase.id}" class="phase-tab ${ph.id===shownPhase.id?'on':''} ${ph.id===p.currentPhaseId?'is-current':''}" onclick="viewPhase('${p.id}','${ph.id}')">
          ${escapeHtml(ph.name)}${ph.tasks.length ? `<span class="n">${d}/${ph.tasks.length}</span>` : ''}
        </button>`;
      }).join('')}
      <button class="phase-tab add" onclick="addPhase('${p.id}')">+ Phase</button>
    </div>
  `;

  // Une seule section : la phase sélectionnée
  {
    const ph = shownPhase;
    const isCurrent = ph.id === p.currentPhaseId;
    const doneN = ph.tasks.filter(t => t.done).length;
    const pct = ph.tasks.length ? Math.round(doneN / ph.tasks.length * 100) : 0;
    html += `
      <div class="card phase-card ${isCurrent?'current':''}" role="tabpanel">
        <div class="phase-head">
          <div style="min-width:0">
            <h3>${escapeHtml(ph.name)}</h3>
            <div class="phase-meta">${ph.tasks.length ? `${doneN} sur ${ph.tasks.length} tâche${ph.tasks.length>1?'s':''} · ${pct}%` : 'Aucune tâche'}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <button class="icon-btn mini" onclick="renamePhase('${p.id}','${ph.id}')" aria-label="Renommer la phase">${ic('pen')}</button>
            ${p.phases.length > 1 ? `<button class="icon-btn mini" onclick="deletePhase('${p.id}','${ph.id}')" aria-label="Supprimer la phase">${ic('trash')}</button>` : ''}
          </div>
        </div>
        ${ph.tasks.length ? `<div class="progress" style="--k:${color};margin-bottom:14px"><div style="width:${pct}%"></div></div>` : ''}
        ${isCurrent
          ? `<div class="phase-flag">${ic('flag')}Phase en cours du projet</div>`
          : `<button class="btn btn-soft btn-sm btn-block" style="margin-bottom:14px" onclick="setCurrentPhase('${p.id}','${ph.id}')">${ic('flag')}Définir comme phase en cours</button>`}
        <div class="add-row">
          <input id="new-task-${ph.id}" placeholder="Ajouter une tâche" onkeydown="if(event.key==='Enter'){addTaskToPhase('${p.id}','${ph.id}')}">
          <button class="icon-btn primary" onclick="addTaskToPhase('${p.id}','${ph.id}')" aria-label="Ajouter">${ic('plus')}</button>
        </div>
        ${renderPhaseTasks(p.id, ph)}
      </div>
    `;
  }

  // Où le projet est planifié, et séances réalisées
  const planned = [];
  state.dayTypes.forEach(dt => dt.blocks.forEach(b => {
    if ((b.projectIds || []).includes(p.id)) planned.push(`${escapeHtml(dt.name)} · ${b.start} ${escapeHtml(b.title)}`);
  }));
  const sessions = projectSessions(p.id);
  html += `
    <div class="section-head"><h2>Séances</h2><span class="aside">${sessions.length} au total</span></div>
    ${planned.length ? `<div class="block-projs" style="margin:-4px 0 12px">${planned.map(t => `<span>${ic('calendar')}${t}</span>`).join('')}</div>` : ''}
    ${sessions.length ? `<div class="card" style="padding:6px 16px">${sessions.slice(0, 12).map(s => `
      <div class="task-row">
        <span class="icon-tile sm" style="--k:${color}">${ic('clock')}</span>
        <span class="task-label">${escapeHtml(s.title || 'Bloc')}<br><span style="font-size:12px;color:var(--ink-3);font-weight:600">${fmtDate(s.dk, { weekday: 'short', day: 'numeric', month: 'short' })}</span></span>
        <span class="badge ${s.status}">${fmtDuration(s.minutes)}</span>
      </div>`).join('')}</div>`
      : `<div class="empty-state"><b>Aucune séance pour l'instant</b>Rattache ce projet à un bloc depuis le Calendrier (Modifier le déroulé d'un jour) ou dans un jour-type, puis valide le bloc.</div>`}
  `;

  html += `
    <div class="card" style="margin-top:20px">
      <button class="accordion-head ${projectInfoOpen?'open':''}" onclick="toggleProjectInfoOpen()">
        <span style="display:flex;align-items:center;gap:10px"><span class="icon-tile sm" style="--k:var(--ink-3)">${ic('edit')}</span>Modifier le projet</span>
        ${ic('chevD')}
      </button>
      ${projectInfoOpen ? `
        <div style="margin-top:6px;">
          <label>Nom</label>
          <input value="${escapeAttr(p.name)}" onchange="updateProjectField('${p.id}','name',this.value);render()">
          <label>Catégorie</label>
          <select onchange="updateProjectField('${p.id}','categoryId',this.value);render()">
            ${state.categories.map(c=>`<option value="${c.id}" ${p.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
          <label>Statut</label>
          <input value="${escapeAttr(p.status)}" onchange="updateProjectField('${p.id}','status',this.value);render()">
          <label>Description</label>
          <textarea rows="3" onchange="updateProjectField('${p.id}','description',this.value);render()">${escapeHtml(p.description)}</textarea>
        </div>
      ` : ''}
    </div>
  `;

  document.getElementById('app').innerHTML = html;
  document.querySelector('.phase-tab.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
let projectInfoOpen = false;
// Phase affichée par projet (choix d'écran, non enregistré) ; par défaut la phase en cours
const viewedPhase = {};
function viewPhase(projId, phaseId) {
  viewedPhase[projId] = phaseId;
  render();
}
function renamePhase(projId, phaseId) {
  const ph = state.projects.find(x => x.id === projId).phases.find(x => x.id === phaseId);
  askText({
    title: 'Renommer la phase', value: ph.name, confirmLabel: 'Enregistrer',
    onSubmit: (name) => { ph.name = name; saveState(); render(); }
  });
}
function toggleProjectInfoOpen() {
  projectInfoOpen = !projectInfoOpen;
  render();
}
function renderPhaseTasks(projId, ph) {
  if (!ph.tasks.length) return `<p class="muted-note">Aucune tâche pour l'instant.</p>`;
  const doneN = ph.tasks.filter(t => t.done).length;
  return ph.tasks.map(t => `
    <div class="task-row">
      <button class="task-checkbox ${t.done?'checked':''}" onclick="toggleTask('${projId}','${ph.id}','${t.id}')" aria-label="${t.done?'Marquer à faire':'Marquer fait'}">${t.done?ic('check'):''}</button>
      <span class="task-label ${t.done?'checked':''}">${escapeHtml(t.title)}${t.due?` <span class="badge">éch. ${t.due}</span>`:''}</span>
      <button class="icon-btn mini task-del" onclick="deleteTask('${projId}','${ph.id}','${t.id}')" aria-label="Supprimer la tâche">${ic('trash')}</button>
    </div>
  `).join('') + (doneN ? `
    <button class="btn btn-sm btn-danger-outline btn-block" style="margin-top:12px" onclick="deleteDoneTasks('${projId}','${ph.id}')">${ic('trash')}${doneN>1 ? `Supprimer les ${doneN} tâches accomplies` : 'Supprimer la tâche accomplie'}</button>` : '');
}
function toggleUrgent(projId) {
  const p = state.projects.find(x => x.id === projId);
  p.urgent = !p.urgent;
  saveState();
  render();
}
function setCurrentPhase(projId, phaseId) {
  const p = state.projects.find(x => x.id === projId);
  p.currentPhaseId = phaseId;
  saveState();
  render();
}
function addPhase(projId) {
  askText({
    title: 'Nouvelle phase', placeholder: 'Ex : Phase 1 — Conception',
    onSubmit: (name) => {
      const p = state.projects.find(x => x.id === projId);
      const newPhase = { id: uid(), name, tasks: [] };
      p.phases.push(newPhase);
      viewedPhase[projId] = newPhase.id;
      saveState();
      render();
    }
  });
}
function deletePhase(projId, phaseId) {
  askConfirm({
    title: 'Supprimer cette phase ?',
    message: 'La phase et toutes ses tâches seront effacées.',
    onConfirm: () => {
      const p = state.projects.find(x => x.id === projId);
      const idx = p.phases.findIndex(ph => ph.id === phaseId);
      p.phases = p.phases.filter(ph => ph.id !== phaseId);
      if (p.currentPhaseId === phaseId) p.currentPhaseId = p.phases[0].id;
      viewedPhase[projId] = p.phases[Math.max(0, idx - 1)].id;
      saveState();
      render();
    }
  });
}
function updateProjectField(projId, field, val) {
  const p = state.projects.find(x => x.id === projId);
  p[field] = val;
  saveState();
}
function addTaskToPhase(projId, phaseId) {
  const input = document.getElementById(`new-task-${phaseId}`);
  const title = input.value.trim();
  if (!title) return;
  const p = state.projects.find(x => x.id === projId);
  const ph = p.phases.find(x => x.id === phaseId);
  ph.tasks.push({ id: uid(), title, done: false, due: '' });
  saveState();
  render();
  document.getElementById(`new-task-${phaseId}`)?.focus();
}
function toggleTask(projId, phaseId, taskId) {
  const p = state.projects.find(x => x.id === projId);
  const ph = p.phases.find(x => x.id === phaseId);
  const t = ph.tasks.find(x => x.id === taskId);
  t.done = !t.done;
  saveState();
  render();
}
function deleteTask(projId, phaseId, taskId) {
  const ph = findProject(projId).phases.find(x => x.id === phaseId);
  const t = ph.tasks.find(x => x.id === taskId);
  askConfirm({
    title: 'Supprimer cette tâche ?',
    message: escapeHtml(t.title),
    onConfirm: () => {
      ph.tasks = ph.tasks.filter(x => x.id !== taskId);
      saveState();
      render();
    }
  });
}
function deleteDoneTasks(projId, phaseId) {
  const ph = findProject(projId).phases.find(x => x.id === phaseId);
  const n = ph.tasks.filter(t => t.done).length;
  askConfirm({
    title: `Supprimer ${n} tâche${n>1?'s':''} accomplie${n>1?'s':''} ?`,
    message: 'Les tâches restantes de la phase sont conservées.',
    onConfirm: () => {
      ph.tasks = ph.tasks.filter(t => !t.done);
      saveState();
      render();
    }
  });
}

// ===================== ECRAN: SUIVI / STATS =====================
function renderStats() {
  const days = Object.keys(state.logs).sort();
  const weekScores = {};
  // semaines du programme : S1 = 7 premiers jours à partir de la date de début définie
  days.forEach(dk => {
    const wk = Math.max(0, Math.floor(daysBetween(state.program.startDate, dk) / 7)) + 1;
    const sc = trackedScore(dk);
    if (sc === null) return;
    if (!weekScores[wk]) weekScores[wk] = [];
    weekScores[wk].push(sc);
  });
  const weekKeys = Object.keys(weekScores).map(Number).sort((a, b) => a - b).slice(-8);

  const allScores = days.map(dk => trackedScore(dk)).filter(s => s !== null);
  const globalAvg = allScores.length ? Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length) : 0;

  let html = `
    ${screenHead('Suivi', 'Ta régularité, semaine après semaine', settingsBtn)}
    <div class="stat-grid">
      ${statTile('target', 'var(--primary)', globalAvg + '%', 'Score global')}
      ${statTile('calendar', 'var(--k-ritual)', allScores.length, 'Jours suivis')}
      ${statTile('trophy', 'var(--mint)', allScores.filter(s=>s>=80).length, 'Jours ≥ 80 %')}
    </div>
    <div class="section-head col"><h2>Par semaine</h2><span class="aside">${weekKeys.length ? 'Semaines du programme · moyenne des jours suivis' : ''}</span></div>
  `;
  if (!weekKeys.length) {
    html += `<div class="empty-state"><span class="icon-tile">${ic('chart')}</span><b>Pas encore de données</b>Valide tes blocs quelques jours, le graphique apparaîtra ici.</div>`;
  } else {
    html += `<div class="card"><div class="bars">${weekKeys.map(wk => {
      const s = weekScores[wk];
      const avg = Math.round(s.reduce((a,b)=>a+b,0)/s.length);
      return `<div class="bar-col">
        <span class="bar-val">${avg}</span>
        <div class="bar-track"><div class="fill-${scoreTone(avg)}" style="height:${Math.max(4, avg)}%"></div></div>
        <span class="bar-lbl" title="${fmtDate(addDays(state.program.startDate, (wk - 1) * 7), { day: 'numeric', month: 'short' })} – ${fmtDate(addDays(state.program.startDate, wk * 7 - 1), { day: 'numeric', month: 'short' })}">S${wk}</span>
      </div>`;
    }).join('')}</div></div>`;
  }

  const activeIdx = currentThemeIndex();
  html += `<div class="section-head"><h2>Thèmes de développement</h2><button class="btn btn-sm btn-soft" onclick="navigate('program')">${ic('edit')}Modifier</button></div>`;
  if (!state.themes.length) {
    html += `<div class="empty-state"><b>Aucun thème</b>Ajoute des thèmes depuis l'écran Mon programme.</div>`;
  }
  const acquired = state.themes.filter(t => t.review && t.review.verdict === 'acquired').length;
  if (state.themes.length) {
    html += `<p class="muted-note" style="margin:-4px 2px 10px">${acquired ? `${acquired} thème${acquired>1?'s':''} acquis sur ${state.themes.length}` : 'Aucun thème acquis pour l’instant'}. Touche un thème pour voir son suivi et son bilan.</p>`;
  }
  html += `<div class="card" style="padding:6px 14px"><ol class="steps">${state.themes.map((t, i) => {
    const cls = i < activeIdx ? 'past' : i === activeIdx ? 'now' : '';
    const st = themeStats(t.id);
    const ok = t.review && t.review.verdict === 'acquired';
    return `<li><button class="step step-btn ${cls}" onclick="openThemeDetail('${t.id}')">
      <span class="step-num ${ok ? 'ok' : ''}">${ok ? ic('check') : i + 1}</span>
      <span class="step-text">${escapeHtml(t.title)}
        ${st.days ? `<span class="step-meta">${st.practiced}/${st.days} jours pratiqués · ${fmtAvg(st.avg)}/5</span>` : ''}
      </span>
      ${themeBadge(t, i)}
    </button></li>`;
  }).join('')}</ol></div>`;

  document.getElementById('app').innerHTML = html;
}

// ----- Blocs-catégorie : liste + éditeur -----
function renderRoutinesSection() {
  const rows = (state.routines || []).map(r => {
    const k = KINDS[r.kind] || KINDS.ritual;
    return `
      <button class="row" onclick="openRoutineEditor('${r.id}')">
        <span class="icon-tile sm" style="--k:${k.color}">${ic(k.icon)}</span>
        <div class="row-main">
          <div class="row-title">${escapeHtml(r.name)}</div>
          <div class="row-sub">${r.tasks.length} tâche${r.tasks.length > 1 ? 's' : ''} · ${fmtDuration(routineTotal(r))}</div>
        </div>
        <span class="chev">${ic('chevR')}</span>
      </button>`;
  }).join('');
  return `
    <div class="section-head"><h2>Blocs-catégorie</h2></div>
    <p class="muted-note" style="margin:-4px 2px 12px">Des groupes de tâches (rituel du matin…) à ajouter en un seul bloc dans tes jours-type. Tu ne renseignes que la durée de chaque tâche.</p>
    ${rows ? `<div class="group">${rows}</div>` : ''}
    <button class="btn btn-dashed btn-block" style="margin-top:10px" onclick="createRoutine()">${ic('plus')}Créer un bloc-catégorie</button>`;
}
function createRoutine() {
  askText({
    title: 'Nouveau bloc-catégorie', placeholder: 'Ex : Rituel matinal',
    onSubmit: (name) => {
      const r = { id: uid(), name, kind: 'ritual', tasks: [] };
      state.routines.push(r);
      saveState();
      render();
      openRoutineEditor(r.id);
    }
  });
}
function renderRoutineTaskRow(rid, t) {
  return `
    <div class="rt-task" id="rtt-${t.id}">
      <input value="${escapeAttr(t.name)}" placeholder="Nom de la tâche" aria-label="Nom de la tâche" onchange="updateRoutineTask('${rid}','${t.id}','name',this.value,this)">
      <input type="time" id="rtd-${t.id}" value="${minToTime(t.minutes)}" aria-label="Durée (h:min)" onchange="updateRoutineTask('${rid}','${t.id}','minutes',this.value,this)">
      <button class="icon-btn" aria-label="Supprimer la tâche" onclick="removeRoutineTask('${rid}','${t.id}')">${ic('trash')}</button>
    </div>`;
}
function openRoutineEditor(id, instant) {
  const r = findRoutine(id);
  if (!r) return;
  openSheet(`
    <div class="label" style="margin-top:0">Nom du bloc</div>
    <input value="${escapeAttr(r.name)}" style="font-size:18px;font-weight:700;margin-bottom:14px" onchange="renameRoutine('${r.id}',this.value)">
    <div class="label">Type</div>
    <select style="margin-bottom:18px" aria-label="Type" onchange="setRoutineKind('${r.id}',this.value)">
      ${Object.entries(KINDS).map(([key, k]) => `<option value="${key}" ${(r.kind || 'ritual') === key ? 'selected' : ''}>${k.label}</option>`).join('')}
    </select>
    <div class="label rt-head"><span>Tâches</span><span id="rt-total">Total : ${fmtDuration(routineTotal(r))}</span></div>
    <button class="btn btn-dashed btn-block" style="margin-bottom:12px" onclick="addRoutineTask('${r.id}')">${ic('plus')}Ajouter une tâche</button>
    <div id="rt-tasks">${r.tasks.map(t => renderRoutineTaskRow(r.id, t)).join('') || '<p class="muted-note">Aucune tâche pour l\'instant.</p>'}</div>
    ${r.tasks.length ? '<p class="muted-note" style="margin-top:0">Durée de chaque tâche en heures : minutes.</p>' : ''}
    <button class="btn btn-block btn-danger-outline" style="margin-top:10px" onclick="deleteRoutine('${r.id}')">${ic('trash')}Supprimer ce bloc-catégorie</button>
    <div class="modal-actions sticky"><button class="btn btn-primary btn-block" onclick="closeModal();render();">Terminé</button></div>
  `, instant ? { instant: true } : undefined);
}
function renameRoutine(id, name) {
  const r = findRoutine(id);
  if (!r) return;
  r.name = name.trim() || r.name;
  syncRoutine(id);
  saveState();
}
function setRoutineKind(id, kind) {
  const r = findRoutine(id);
  if (!r) return;
  r.kind = kind;
  syncRoutine(id);
  saveState();
}
function updateRoutineTask(rid, tid, field, val, el) {
  const r = findRoutine(rid);
  const t = r && r.tasks.find(x => x.id === tid);
  if (!t) return;
  if (field === 'name') t.name = val.trim() || t.name;
  else {
    t.minutes = Math.max(1, val ? timeToMin(val) : t.minutes);
    if (el) el.value = minToTime(t.minutes);
  }
  syncRoutine(rid);
  saveState();
  const total = document.getElementById('rt-total');
  if (total) total.textContent = 'Total : ' + fmtDuration(routineTotal(r));
}
function addRoutineTask(rid) {
  const r = findRoutine(rid);
  if (!r) return;
  const t = { id: uid(), name: 'Nouvelle tâche', minutes: 5 };
  r.tasks.push(t);
  syncRoutine(rid);
  saveState();
  openRoutineEditor(rid, true);
  const row = document.getElementById('rtt-' + t.id);
  if (row) {
    row.scrollIntoView({ block: 'center' });
    row.classList.add('fresh');
    const inp = row.querySelector('input');
    if (inp) { inp.focus({ preventScroll: true }); inp.select(); }
  }
}
function removeRoutineTask(rid, tid) {
  const r = findRoutine(rid);
  if (!r) return;
  r.tasks = r.tasks.filter(t => t.id !== tid);
  syncRoutine(rid);
  saveState();
  openRoutineEditor(rid, true);
}
function deleteRoutine(id) {
  askConfirm({
    title: 'Supprimer ce bloc-catégorie ?',
    message: 'Les blocs qui l’utilisent deviennent des blocs libres, avec les mêmes horaires.',
    onConfirm: () => {
      state.routines = state.routines.filter(r => r.id !== id);
      eachBlockList(list => list.forEach(b => { if (b.routineId === id) delete b.routineId; }));
      saveState();
      render();
    }
  });
}
function stepSetting(key, delta) {
  let v = (state.settings[key] || 0) + delta;
  if (key === 'themeIndex') v = Math.max(0, Math.min(state.themes.length - 1, v));
  else v = Math.max(0, v);
  updateSetting(key, v);
  render();
}
function addCategory() {
  askText({
    title: 'Nouvelle catégorie', placeholder: 'Ex : Santé',
    onSubmit: (name) => {
      const used = state.categories.map(c => c.color);
      const color = CAT_COLORS.find(c => !used.includes(c)) || CAT_COLORS[state.categories.length % CAT_COLORS.length];
      state.categories.push({ id: uid(), name, color });
      saveState(); render();
    }
  });
}
function updateSetting(key, val) {
  state.settings[key] = val;
  saveState();
}
function resetData() {
  askConfirm({
    title: 'Tout réinitialiser ?',
    message: 'Toutes les données seront supprimées et le programme repartira de zéro.',
    confirmLabel: 'Réinitialiser',
    onConfirm: () => {
      localStorage.removeItem(STORE_KEY);
      state = defaultState();
      ob = null;
      navigate('today');
    }
  });
}

// ===================== ECRAN: MON PROGRAMME =====================
const DURATION_PRESETS = [21, 30, 60, 90, 120];
const backTargets = { program: 'settings', journal: 'settings' };
const SCREEN_LABELS = { today: 'Aujourd\'hui', planning: 'Calendrier', projects: 'Projets', stats: 'Suivi', settings: 'Réglages', finance: 'Finances', program: 'Mon programme', journal: 'Carnet' };
function backButton(screen) {
  const to = backTargets[screen] || 'settings';
  return `<button class="back-btn" onclick="navigate('${to}')">${ic('chevL')}${SCREEN_LABELS[to] || 'Retour'}</button>`;
}

function programStatusBadge(phase) {
  if (phase === 'upcoming') return '<span class="badge partial">À venir</span>';
  if (phase === 'finished') return '<span class="badge done">Terminé</span>';
  return '<span class="badge primary">En cours</span>';
}

function durationPicker(value, onPick, onCustom) {
  const custom = !DURATION_PRESETS.includes(value);
  return `
    <div class="seg">
      ${DURATION_PRESETS.map(n => `<button type="button" class="${value===n?'on':''}" onclick="${onPick}(${n})">${n} jours</button>`).join('')}
    </div>
    <div class="dur-custom">
      <span>Ou une durée libre :</span>
      <input type="number" min="7" max="365" inputmode="numeric" value="${value}" class="${custom?'on':''}" onchange="${onCustom}(this.value)" aria-label="Durée en jours">
      <span>jours</span>
    </div>`;
}

function renderProgram() {
  const p = state.program;
  const info = programInfo();
  const inProgram = Object.keys(state.logs).filter(k => {
    const i = daysBetween(p.startDate, k); return i >= 0 && i < info.total;
  }).map(trackedScore).filter(s => s !== null);
  const avg = inProgram.length ? Math.round(inProgram.reduce((a,b)=>a+b,0)/inProgram.length) : 0;
  const elapsedPct = info.phase === 'upcoming' ? 0 : Math.round(Math.min(info.idx + 1, info.total) / info.total * 100);
  const themeIdx = currentThemeIndex();
  const weeks = info.weeks;

  let html = `
    <div class="screen-head" style="align-items:center;margin-bottom:14px">
      ${backButton('program')}
    </div>

    <section class="proj-hero" style="--k:var(--primary)">
      ${programStatusBadge(info.phase)}
      <h1>${escapeHtml(p.name)}</h1>
      <p class="desc">Du ${fmtDate(p.startDate,{weekday:'long',day:'numeric',month:'long'})} au ${fmtDate(p.endDate,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
      <div class="progress" style="margin-top:16px;background:var(--surface)"><div style="width:${elapsedPct}%"></div></div>
      <div class="proj-hero-stats">
        <div><b>${info.phase==='upcoming' ? 'J-' + (-info.idx) : info.dayNum + '/' + info.total}</b><span>${info.phase==='upcoming' ? 'Avant le début' : 'Jour'}</span></div>
        <div><b>${inProgram.length}</b><span>Jours suivis</span></div>
        <div><b>${avg}%</b><span>Score moyen</span></div>
      </div>
    </section>

    <div class="section-head" style="margin-top:8px"><h2>Calendrier</h2></div>
    <div class="card">
      <div class="field">
        <label for="prog-name">Nom du programme</label>
        <input id="prog-name" value="${escapeAttr(p.name)}" onchange="updateProgramName(this.value)">
      </div>
      <div class="field">
        <label for="prog-start">Date de début</label>
        <input id="prog-start" type="date" value="${p.startDate}" onchange="setProgramStart(this.value)">
      </div>
      <div class="field">
        <label>Durée</label>
        ${durationPicker(p.durationDays, 'setProgramDuration', 'setProgramDuration')}
      </div>
      <div class="ob-summary">
        ${ic('flag')}
        <span>Fin le ${fmtDate(p.endDate,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${weeks} semaine${weeks>1?'s':''}</span>
      </div>
    </div>

    <div class="section-head"><h2>Thèmes de la semaine</h2><span class="aside">${state.themes.length}</span></div>
    <div class="group">
      <div class="row">
        <span class="icon-tile sm" style="--k:var(--k-growth)">${ic('sparkles')}</span>
        <div class="row-main">
          <div class="row-title">Avancer chaque semaine</div>
          <div class="row-sub">Le thème change automatiquement tous les 7 jours</div>
        </div>
        <button class="switch ${state.settings.themeAuto?'on':''}" role="switch" aria-checked="${!!state.settings.themeAuto}" aria-label="Avancer chaque semaine" onclick="toggleThemeAuto()"></button>
      </div>
      ${!state.settings.themeAuto && state.themes.length ? `
      <div class="row">
        <span class="icon-tile sm" style="--k:var(--primary)">${ic('target')}</span>
        <div class="row-main"><div class="row-title">Thème actuel</div><div class="row-sub">${escapeHtml(currentTheme().title)}</div></div>
        <div class="stepper">
          <button onclick="stepTheme(-1)" aria-label="Thème précédent">${ic('minus')}</button>
          <span>${themeIdx + 1}</span>
          <button onclick="stepTheme(1)" aria-label="Thème suivant">${ic('plus')}</button>
        </div>
      </div>` : ''}
    </div>
    ${state.themes.length && state.themes.length < weeks ? `<p class="muted-note" style="margin:0 4px 10px">Ton programme dure ${weeks} semaines pour ${state.themes.length} thèmes : le dernier thème sera prolongé.</p>` : ''}
    <div class="card" style="padding:6px 14px">
      ${state.themes.length ? `<ol class="steps">${state.themes.map((t, i) => {
        const cls = i < themeIdx ? 'past' : i === themeIdx ? 'now' : '';
        return `<li class="step ${cls}">
          <span class="step-num">${i + 1}</span>
          <span class="step-text">${escapeHtml(t.title)}</span>
          <button class="icon-btn mini" onclick="editTheme(${i})" aria-label="Modifier le thème">${ic('pen')}</button>
          <button class="icon-btn mini" onclick="deleteTheme(${i})" aria-label="Supprimer le thème">${ic('trash')}</button>
        </li>`;
      }).join('')}</ol>` : '<p class="muted-note" style="padding:12px 0">Aucun thème pour l\'instant.</p>'}
    </div>
    <button class="btn btn-dashed btn-block" onclick="addTheme()">${ic('plus')}Ajouter un thème</button>

    <div class="section-head"><h2>Configuration guidée</h2></div>
    <div class="card flat">
      <p style="font-size:14px;color:var(--ink-2);margin-bottom:14px">Reprends les étapes du premier lancement pour tout réajuster d'un coup. Ton historique et tes projets sont conservés.</p>
      <button class="btn btn-soft btn-block" onclick="restartOnboarding()">${ic('sparkles')}Relancer la configuration</button>
    </div>
  `;
  document.getElementById('app').innerHTML = html;
}

function isDefaultProgramName(name) { return !name || /^Programme \d+ jours$/.test(name.trim()); }
function updateProgramName(v) {
  state.program.name = v.trim() || state.program.name;
  saveState();
}
function setProgramStart(v) {
  if (!v) return;
  setProgramDates(v, state.program.durationDays);
  saveState(); render();
}
function setProgramDuration(n) {
  n = parseInt(n, 10);
  if (!n) return;
  setProgramDates(state.program.startDate, n);
  if (isDefaultProgramName(state.program.name)) state.program.name = `Programme ${state.program.durationDays} jours`;
  saveState(); render();
}
function toggleThemeAuto() {
  state.settings.themeAuto = !state.settings.themeAuto;
  // en repassant en manuel, on garde le thème affiché jusqu'ici
  if (!state.settings.themeAuto) state.settings.themeIndex = Math.max(0, Math.floor(Math.max(0, programInfo().idx) / 7));
  state.settings.themeIndex = Math.min(state.settings.themeIndex, Math.max(0, state.themes.length - 1));
  saveState(); render();
}
function stepTheme(delta) {
  const n = state.themes.length;
  state.settings.themeIndex = Math.max(0, Math.min(n - 1, (state.settings.themeIndex || 0) + delta));
  saveState(); render();
}
function editTheme(i) { openThemeDetail(state.themes[i].id); }
function deleteTheme(i) {
  askConfirm({
    title: 'Supprimer ce thème ?',
    message: escapeHtml(state.themes[i].title) + ' — son suivi sera aussi effacé.',
    onConfirm: () => {
      const id = state.themes[i].id;
      state.themes.splice(i, 1);
      Object.keys(state.themeLogs).forEach(k => { if (state.themeLogs[k].themeId === id) delete state.themeLogs[k]; });
      state.settings.themeIndex = Math.max(0, Math.min(state.settings.themeIndex || 0, state.themes.length - 1));
      saveState(); render();
    }
  });
}
function addTheme() {
  askText({
    title: 'Nouveau thème', placeholder: 'Ex : Gestion du temps', confirmLabel: 'Ajouter',
    onSubmit: (v) => {
      const t = makeTheme(v);
      state.themes.push(t);
      saveState(); render();
      openThemeDetail(t.id);
    }
  });
}
function findTheme(id) { return state.themes.find(t => t.id === id); }
function updateThemeField(id, field, val) {
  const t = findTheme(id);
  if (!t) return;
  t[field] = field === 'title' ? (val.trim() || t.title) : val.trim();
  saveState();
}

// Fiche d'un thème : suivi, bilan, pratique
function openThemeDetail(id) {
  const t = findTheme(id);
  if (!t) return;
  const i = state.themes.indexOf(t);
  const st = themeStats(id);
  const recent = st.logs.slice(-14);
  const r = t.review;
  openSheet(`
    <div class="sheet-head">
      <span class="icon-tile solid" style="--k:var(--k-growth)">${ic('sparkles')}</span>
      <div style="flex:1;min-width:0">
        <div class="modal-sub" style="margin:0 0 2px">Thème ${i + 1} sur ${state.themes.length}</div>
        <div class="modal-title">${escapeHtml(t.title)}</div>
      </div>
      ${themeBadge(t, i)}
    </div>

    <div class="stat-grid">
      ${statTile('check', 'var(--mint)', st.practiced + '<small>/' + st.days + '</small>', 'Jours pratiqués')}
      ${statTile('target', 'var(--primary)', st.regularity === null ? '–' : st.regularity + '%', 'Régularité')}
      ${statTile('trophy', 'var(--amber)', fmtAvg(st.avg) + '<small>/5</small>', 'Note moyenne')}
    </div>

    ${recent.length ? `
    <div class="card" style="margin-top:12px">
      <div class="label" style="margin-top:0">Jour par jour</div>
      <div class="mini-bars">
        ${recent.map(([k, l]) => `<div class="mb-col" title="${fmtDate(k, { day: 'numeric', month: 'short' })}">
          <div class="mb-track"><div class="${l.practice ? 'fill-' + PRACTICE[l.practice].tone : 'fill-none'}" style="height:${l.rating ? l.rating * 20 : 8}%"></div></div>
          <span>${fmtDate(k, { day: 'numeric' })}</span>
        </div>`).join('')}
      </div>
      <p class="muted-note" style="padding-bottom:0">Hauteur : note du jour. Couleur : pratique faite, partielle ou non.</p>
    </div>` : `<div class="empty-state" style="margin-top:12px"><b>Pas encore de suivi</b>Le check-in se fait chaque jour depuis la carte du thème, sur l'écran Aujourd'hui.</div>`}

    <div class="section-head" style="margin-top:22px"><h2>Bilan de la semaine</h2></div>
    ${r ? `
      <div class="card">
        ${VERDICTS[r.verdict] ? `<span class="badge ${VERDICTS[r.verdict].cls}" style="margin-bottom:12px">${VERDICTS[r.verdict].label}</span>` : ''}
        ${reviewLine('Ce qui a progressé', r.progress)}

function sumOf(arr) { return arr.reduce((a, b) => a + b, 0); }
function round2(n) { return Math.round(n * 100) / 100; }
function money(n, signed) {
  const v = Math.abs(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  const sign = signed ? (n > 0 ? '+' : n < 0 ? '−' : '') : (n < 0 ? '−' : '');
  return `${sign}${v} ${state.finance.currency || '€'}`;
}
function parseAmount(v) {
  const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
  return isFinite(n) && n > 0 ? round2(n) : null;
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function flagInvalid(id) {
  const el = document.getElementById(id);
  if (el) { el.classList.add('invalid'); el.focus(); }
}
function findDebt(id) { return state.finance.debts.find(d => d.id === id); }

// --- Prêts / emprunts : paiements, échéancier, rappels ---
function debtPaid(d) { return round2(sumOf(d.payments.map(p => p.amount))); }
function debtRemaining(d) { return Math.max(0, round2(d.amount - debtPaid(d))); }
// Les paiements couvrent les échéances dans l'ordre
function debtSchedule(d) {
  const today = dateKey(new Date());
  let cum = debtPaid(d);
  return (d.schedule || []).map(it => {
    const covered = Math.min(it.amount, Math.max(0, cum));
    cum = round2(cum - covered);
    const left = round2(it.amount - covered);
    return { ...it, left, status: left <= 0 ? 'paid' : it.date < today ? 'late' : 'due' };
  });
}
function debtNextDue(d) {
  const rem = debtRemaining(d);
  if (rem <= 0) return null;
  const s = debtSchedule(d).find(it => it.status !== 'paid');
  if (s) return { date: s.date, amount: s.left };
  if (d.dueDate) return { date: d.dueDate, amount: rem };
  return null;
}
function makeSchedule(total, count, firstDate, freq) {
  const n = Math.max(1, count | 0);
  const base = Math.floor(total / n * 100) / 100;
  const items = [];
  let acc = 0;
  for (let i = 0; i < n; i++) {
    const amount = i === n - 1 ? round2(total - acc) : base;
    acc = round2(acc + amount);
    let date;
    if (freq === 'week') date = addDays(firstDate, 7 * i);
    else { const x = new Date(firstDate + 'T00:00:00'); x.setMonth(x.getMonth() + i); date = dateKey(x); }
    items.push({ id: uid(), date, amount });
  }
  return items;
}
function financeReminders() {
  const today = dateKey(new Date());
  const horizon = addDays(today, state.finance.remindDays ?? 3);
  return state.finance.debts
    .map(d => ({ d, due: debtNextDue(d) }))
    .filter(x => x.due && x.due.date <= horizon)
    .map(x => ({ ...x, days: daysBetween(today, x.due.date) }))
    .sort((a, b) => a.due.date.localeCompare(b.due.date));
}
function reminderText(r, plain) {
  const who = plain ? r.d.person : escapeHtml(r.d.person);
  return r.d.direction === 'lent'
    ? `${who} doit te rembourser ${money(r.due.amount)}`
    : `Rembourser ${money(r.due.amount)} à ${who}`;
}
function dueLabel(days) {
  if (days < 0) return `en retard de ${-days} j`;
  if (days === 0) return "aujourd'hui";
  if (days === 1) return 'demain';
  return `dans ${days} j`;
}
